<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="740" viewBox="0 0 1420 740"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="740" rx="28"/><text class="title" x="42" y="58">图 1  系统全景能力架构</text><text class="subtitle" x="42" y="86">从前端工作区到后端执行与采集层，展示项目在当前代码中的完整能力面。</text><rect class="card" x="48" y="132" width="1324" height="84" rx="22"/><rect x="66" y="150" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="66" y="184">导入层</text><text class="p" x="66" y="210"><tspan x="66" dy="0">已保存主机 / 连接来源 / 硬件概览 / 选卡导入</tspan></text><line x1="710" y1="216" x2="698" y2="236" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polygon points="710,236 698,230 698,242" fill="#2563EB"/><rect class="card" x="48" y="236" width="1324" height="84" rx="22"/><rect x="66" y="254" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="66" y="288">治理层</text><text class="p" x="66" y="314"><tspan x="66" dy="0">即时处置 / 策略治理 / 集群作业 / 治理复盘</tspan></text><line x1="710" y1="320" x2="698" y2="340" stroke="#059669" stroke-width="4" stroke-linecap="round"/><polygon points="710,340 698,334 698,346" fill="#059669"/><rect class="card" x="48" y="340" width="1324" height="84" rx="22"/><rect x="66" y="358" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="66" y="392">分析层</text><text class="p" x="66" y="418"><tspan x="66" dy="0">能耗 / 观察 / 告警</tspan></text><line x1="710" y1="424" x2="698" y2="444" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><polygon points="710,444 698,438 698,450" fill="#D97706"/><rect class="card" x="48" y="444" width="1324" height="84" rx="22"/><rect x="66" y="462" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="66" y="496">智能层</text><text class="p" x="66" y="522"><tspan x="66" dy="0">智能工作台 / 图谱工作台 / Agent Runtime / 控制能力目录</tspan></text><line x1="710" y1="528" x2="698" y2="548" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="710,548 698,542 698,554" fill="#0891B2"/><rect class="card" x="48" y="548" width="1324" height="84" rx="22"/><rect x="66" y="566" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="66" y="600">执行与采集层</text><text class="p" x="66" y="626"><tspan x="66" dy="0">server-agent / HTTP/SSH provider / WebSocket / SQLite/Neo4j</tspan></text><text class="p" x="48" y="676"><tspan x="48" dy="0">作品书的系统主轴：导入层先建立治理边界，随后进入治理、分析与智能工作区，再由 server-agent、Provider 与存储层支撑历史回放和扩展能力。</tspan><tspan x="48" dy="24">该分层直接对应 frontend/src/main.js、useConsoleShell.js、backend/app/main.py 和 server-agent/main.py。</tspan></text></svg>