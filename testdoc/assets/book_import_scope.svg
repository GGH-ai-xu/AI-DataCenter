<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="500" viewBox="0 0 1420 500"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="500" rx="28"/><text class="title" x="42" y="58">图 10  导入作用域建立链路</text><text class="subtitle" x="42" y="86">该图用最小指标集说明导入动作为何是整个平台的起点。</text><rect class="card" x="54" y="154" width="286" height="162" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="206">导入前 raw</text><text class="p" x="72" y="232"><tspan x="72" dy="0">GPU 4</tspan><tspan x="72" dy="22">进程 11</tspan></text><rect class="card" x="392" y="154" width="286" height="162" rx="22"/><rect x="410" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="410" y="206">提交 import context</text><text class="p" x="410" y="232"><tspan x="410" dy="0">保存 imported_gpu_indexes</tspan><tspan x="410" dy="22">触发 refresh_runtime_snapshot_scope</tspan></text><rect class="card" x="730" y="154" width="286" height="162" rx="22"/><rect x="748" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="748" y="206">导入后 scoped</text><text class="p" x="748" y="232"><tspan x="748" dy="0">GPU 2</tspan><tspan x="748" dy="22">进程 5</tspan></text><rect class="card" x="1068" y="154" width="298" height="162" rx="22"/><rect x="1086" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="1086" y="206">越界可见数</text><text class="p" x="1086" y="232"><tspan x="1086" dy="0">0</tspan><tspan x="1086" dy="22">非作用域资源不再进入下游页面</tspan></text><line x1="340" y1="236" x2="380" y2="236" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polygon points="392,236 380,230 380,242" fill="#2563EB"/><line x1="678" y1="236" x2="718" y2="236" stroke="#059669" stroke-width="4" stroke-linecap="round"/><polygon points="730,236 718,230 718,242" fill="#059669"/><line x1="1016" y1="236" x2="1056" y2="236" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><polygon points="1068,236 1056,230 1056,242" fill="#D97706"/><rect x="54" y="378" width="430" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="403">代码依据</text><text class="h" x="72" y="425" fill="#2563EB">system_import.commit_import_context -&gt; refresh_runtime_snapshot_scope</text><rect x="508" y="378" width="406" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="526" y="403">能力结论</text><text class="h" x="526" y="425" fill="#059669">边界建立发生在后端快照层</text><rect x="938" y="378" width="428" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="956" y="403">评审回答</text><text class="h" x="956" y="425" fill="#D97706">不是前端把别的 GPU 隐藏起来，而是系统级 scope 已被改写</text></svg>