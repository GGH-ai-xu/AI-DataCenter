<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="742" viewBox="0 0 1420 742"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="742" rx="28"/><text class="title" x="42" y="58">图 3  痛点问题到模块能力映射</text><text class="subtitle" x="42" y="86">用矩阵方式把第 2 章的‘问题分析’和第 3-4 章的‘技术方案/系统实现’对接起来。</text><rect class="card" x="42" y="124" width="1334" height="504" rx="24"/><text class="s" x="66" y="154">痛点问题</text><text class="s" x="400" y="154">对应模块</text><text class="s" x="952" y="154">代码证据</text><rect x="56" y="170" width="1306" height="70" rx="16" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="h" x="74" y="196"><tspan x="74" dy="0">接入后看得见但管不住</tspan></text><text class="p" x="400" y="194"><tspan x="400" dy="0">导入层</tspan><tspan x="400" dy="18">runtime_snapshot</tspan><tspan x="400" dy="18">tasks/scheduler scope</tspan></text><text class="p" x="952" y="194"><tspan x="952" dy="0">commit_import_context + refresh_runtime_snapshot_scope</tspan></text><rect x="56" y="258" width="1306" height="70" rx="16" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="h" x="74" y="284"><tspan x="74" dy="0">危险动作缺少统一审批与追踪</tspan></text><text class="p" x="400" y="282"><tspan x="400" dy="0">control_plane</tspan><tspan x="400" dy="18">GovernanceActions</tspan><tspan x="400" dy="18">GovernanceReview</tspan></text><text class="p" x="952" y="282"><tspan x="952" dy="0">approval_state / execution_state / command ledger</tspan></text><rect x="56" y="346" width="1306" height="70" rx="16" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="h" x="74" y="372"><tspan x="74" dy="0">策略写入与复盘脱节</tspan></text><text class="p" x="400" y="370"><tspan x="400" dy="0">GovernancePolicies</tspan><tspan x="400" dy="18">governance full-report</tspan></text><text class="p" x="952" y="370"><tspan x="952" dy="0">refreshPolicies + refreshReview + export_full_governance_report</tspan></text><rect x="56" y="434" width="1306" height="70" rx="16" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="h" x="74" y="460"><tspan x="74" dy="0">运行数据多源异构，难以统一分析</tspan></text><text class="p" x="400" y="458"><tspan x="400" dy="0">server-agent</tspan><tspan x="400" dy="18">DataStore</tspan><tspan x="400" dy="18">EnergyAnalytics</tspan><tspan x="400" dy="18">GovernanceService</tspan></text><text class="p" x="952" y="458"><tspan x="952" dy="0">collector -&gt; store -&gt; analysis/replay</tspan></text><rect x="56" y="522" width="1306" height="70" rx="16" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="h" x="74" y="548"><tspan x="74" dy="0">智能、图谱、集群能力容易与主平台割裂</tspan></text><text class="p" x="400" y="546"><tspan x="400" dy="0">agent_runtime</tspan><tspan x="400" dy="18">graph</tspan><tspan x="400" dy="18">cluster_jobs</tspan><tspan x="400" dy="18">ConsoleShell</tspan></text><text class="p" x="952" y="546"><tspan x="952" dy="0">统一挂载到主控制台与工作区</tspan></text><rect x="56" y="648" width="408" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="74" y="673">章节作用</text><text class="h" x="74" y="695" fill="#2563EB">第 2 章把问题与模块一一对上</text><rect x="496" y="648" width="408" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="514" y="673">真实性策略</text><text class="h" x="514" y="695" fill="#059669">只写代码里存在的机制，不沿用旧示例稿口径</text><rect x="936" y="648" width="426" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="954" y="67