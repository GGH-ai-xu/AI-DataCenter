<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="560" viewBox="0 0 1420 560"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="560" rx="28"/><text class="title" x="42" y="58">图 20  扩展能力验证状态</text><text class="subtitle" x="42" y="86">第 5 章既要展示已稳定能力，也要如实说明 AI 扩展层目前存在的测试漂移。</text><rect class="card" x="54" y="154" width="620" height="88" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="72" y="206">Agent / Monitor / Cluster / Graph</text><text class="p" x="72" y="232"><tspan x="72" dy="0">真实通过 21 项</tspan><tspan x="72" dy="22">耗时 0.73 s</tspan></text><rect class="card" x="54" y="266" width="620" height="88" rx="22"/><rect x="72" y="284" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="72" y="318">Agent Runtime API</text><text class="p" x="72" y="344"><tspan x="72" dy="0">真实通过 3 项</tspan><tspan x="72" dy="22">耗时 0.38 s</tspan></text><rect class="card" x="744" y="154" width="622" height="108" rx="22"/><rect x="762" y="172" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="762" y="206">tests/test_goal_runtime_api.py</text><text class="p" x="762" y="232"><tspan x="762" dy="0">collection_error</tspan><tspan x="762" dy="22">append_agent_runtime_chat_turn 与现有 agent_runtime.py 接口不一致</tspan></text><rect class="card" x="744" y="286" width="622" height="108" rx="22"/><rect x="762" y="304" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="762" y="338">backend/tests/test_ai_control.py</text><text class="p" x="762" y="364"><tspan x="762" dy="0">collection_error</tspan><tspan x="762" dy="22">SUPPORTED_ACTIONS 与现有 control_heuristics 接口不一致</tspan></text><rect x="54" y="432" width="412" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="457">写作策略</text><text class="h" x="72" y="479" fill="#2563EB">对扩展层不做“全绿化”包装，稳定项与漂移项分开呈现</text><rect x="488" y="432" width="412" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="506" y="457">评审收益</text><text class="h" x="506" y="479" fill="#059669">这样更能体现项目处于真实迭代，而不是把所有模块都写成完美完成态</text><rect x="922" y="432" width="444" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="940" y="457">章节结论</text><text class="h" x="940" y="479" fill="#D97706">扩展层已有稳定可验证部分，同时存在接口演进中的测试漂移，需要后续同步</text></svg>