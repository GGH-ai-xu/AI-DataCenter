<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="620" viewBox="0 0 1420 620"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="620" rx="28"/><text class="title" x="42" y="58">图 7  智能、图谱与集群扩展能力</text><text class="subtitle" x="42" y="86">用路由数与控制能力前缀证明项目并非单一治理页，而是主平台 + 扩展能力的复合系统。</text><rect class="card" x="56" y="164" width="392" height="132" rx="22"/><rect x="74" y="182" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="74" y="216">AI Runtime</text><text class="p" x="74" y="242"><tspan x="74" dy="0">路由 8</tspan><tspan x="74" dy="22">session / approval / event stream</tspan></text><rect class="card" x="504" y="164" width="392" height="132" rx="22"/><rect x="522" y="182" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="522" y="216">Graph</text><text class="p" x="522" y="242"><tspan x="522" dy="0">路由 10</tspan><tspan x="522" dy="22">view / neighbors / qa / strategy</tspan></text><rect class="card" x="952" y="164" width="392" height="132" rx="22"/><rect x="970" y="182" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="970" y="216">Cluster</text><text class="p" x="970" y="242"><tspan x="970" dy="0">路由 18</tspan><tspan x="970" dy="22">job / queue / checkpoint / reconcile</tspan></text><rect class="card" x="56" y="352" width="620" height="206" rx="22"/><rect x="74" y="370" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="74" y="404">控制能力前缀分布</text><text class="p" x="74" y="