<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="720" viewBox="0 0 1420 720"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="720" rx="28"/><text class="title" x="42" y="58">治理时延与清洁率</text><text class="subtitle" x="42" y="86">把实验拆成事件链，直接展示从双卡越阈到治理卡回落、对照卡持续越阈的时间顺序。</text><rect class="card" x="54" y="154" width="274" height="148" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="72" y="206">首次越阈</text><text class="p" x="72" y="232"><tspan x="72" dy="0">治理卡 22.09s</tspan><tspan x="72" dy="22">对照卡 22.09s</tspan></text><rect class="card" x="366" y="154" width="274" height="148" rx="22"/><rect x="384" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="384" y="206">治理动作</text><text class="p" x="384" y="232"><tspan x="384" dy="0">动作开始 23.18s</tspan><tspan x="384" dy="22">预算 783W</tspan></text><rect class="card" x="678" y="154" width="274" height="148" rx="22"/><rect x="696" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="696" y="206">首次回落</text><text class="p" x="696" y="232"><tspan x="696" dy="0">治理卡 23.18s</tspan><tspan x="696" dy="22">对照卡 未回落</tspan></text><rect class="card" x="990" y="154" width="376" height="148" rx="22"/><rect x="1008" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="1008" y="206">恢复延迟</text><text class="p" x="1008" y="232"><tspan x="1008" dy="0">治理卡 recovery_latency = 0.00s</tspan><tspan x="1008" dy="22">对照卡在观测窗口内始终高于阈值</tspan></text><rect class="card" x="42" y="344" width="1336" height="250" rx="24"/><text class="h" x="68" y="382">治理事件链</text><line x1="108" y1="472" x2="1308" y2="472" stroke="#D7E1EC" stroke-width="8" stroke-linecap="round"/><circle cx="160" cy="472" r="14" fill="#DC2626"/><text class="k" x="140" y="438">22.09s</text><text class="p" x="88" y="518">双卡同时越阈</text><circle cx="536" cy="472" r="14" fill="#0891B2"/><text class="k" x="516" y="438">23.18s</text><text class="p" x="464" y="518">系统对 GPU1 下发限功率</text><circle cx="912" cy="472" r="14" fill="#059669"/><text class="k" x="892" y="438">23.18s</text><text class="p" x="840" y="518">治理卡首次回到阈值下方</text><circle cx="1248" cy="472" r="14" fill="#D97706"/><text class="k" x="1228" y="438">后窗结束</text><text class="p" x="1176" y="518">对照卡仍 18/18 越阈</text><rect x="54" y="624" width="250" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="72" y="649">治理卡清洁率</text><text class="h" x="72" y="671" fill="#059669">100.0%</text><rect x="328" y="624" width="250" height="64" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text class="s" x="346" y="649">对照卡清洁率</text><text class="h" x="346" y="671" fill="#DC2626">0.0%</text><rect x="602" y="624" width="346" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="620" y="649">治理卡功耗回落</text><text class="h" x="620" y="671" fill="#2563EB">79.93W</text><rect x="972" y="624" width="394" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="990" y="649">对照卡未治理表现</text><text class="h" x="990" y="671" fill="#D97706">后窗均值 328.26W</text></svg>