<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="716" viewBox="0 0 1420 716"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="716" rx="28"/><text class="title" x="42" y="58">图 16  Agent 运行模式与平台适配</text><text class="subtitle" x="42" y="86">平台不是简单调用 Agent，而是把 Agent 输出经过 Provider、导入边界与页面模型进一步整合。</text><rect class="card" x="42" y="126" width="1336" height="574" rx="24"/><rect class="card" x="58" y="158" width="1304" height="86" rx="22"/><rect x="76" y="176" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="76" y="210">远程 Provider 兼容</text><text class="p" x="76" y="236"><tspan x="76" dy="0">system-detail 路由可透过 HttpAgentProvider 读取远程系统详情</tspan></text><rect class="card" x="58" y="264" width="1304" height="86" rx="22"/><rect x="76" y="282" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="76" y="316">导入后训练日志过滤</text><text class="p" x="76" y="342"><tspan x="76" dy="0">training 路由只保留 imported GPUs 对应日志</tspan></text><rect class="card" x="58" y="370" width="1304" height="86" rx="22"/><rect x="76" y="388" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="76" y="422">缺失 NVML 时明确提示</text><text class="p" x="76" y="448"><tspan x="76" dy="0">启动日志不会伪造 GPU 结果，而是给出 SSH Linux / 远程 Agent 提示</tspan></text><rect class="card" x="58" y="476" width="1304" height="86" rx="22"/><rect x="76" y="494" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="76" y="528">进程缓存采样</text><text class="p" x="76" y="554"><tspan x="76" dy="0">连续 3 次读取仅触发 2 次真实扫描，降低采样阻塞</tspan></text><rect x="58" y="610" width="330" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="76" y="635">核心结论</text><text class="h" x="76" y="657" fill="#2563EB">Agent 数据进入平台后还会再经过 Provider、import scope 与 privacy 处理</text><rect x="408" y="610" width="402" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="426" y="635">不是原样透传</text><text class="h" x="426" y="657" fill="#059669">系统详情、训练日志和 GPU 进程并非直接裸转发，而是会按导入边界做二次约束</text><rect x="830" y="610" width="532" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="848" y="635">测试意义</text><text class="h" x="848" y="657" fill="#D97706">这张图把 Agent 的“可接入性”“可过滤性”“可解释性”一起展现出来</text></svg>