<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="540" viewBox="0 0 1420 540"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="540" rx="28"/><text class="title" x="42" y="58">实验 F：跨 GPU 检查点恢复时间线</text><text class="subtitle" x="42" y="86">观察源卡负载退出与目标卡负载接手是否在同一条事件链上发生。</text><rect class="card" x="42" y="126" width="820" height="352" rx="24"/><rect class="card" x="900" y="126" width="478" height="352" rx="24"/><polyline points="84.0,285.7 164.0,355.9 244.0,355.8 324.0,354.9 404.0,286.2 484.0,328.7 564.0,398.3 644.0,417.2 724.0,416.2 804.0,417.8" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polyline points="84.0,418.4 164.0,418.9 244.0,418.5 324.0,418.9 404.0,415.0 484.0,418.2 564.0,255.7 644.0,255.2 724.0,255.2 804.0,254.8" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><text class="h" x="74" y="164">源卡与目标卡功耗切换时间线</text><text class="p" x="920" y="178">蓝线是源 GPU，橙线是目标 GPU。</text><text class="p" x="920" y="206">暂停阶段蓝线明显跌落；恢复后橙线抬升。</text><text class="p" x="920" y="234">这说明负载从源卡退出后，重新落到了目标卡。</text><rect x="920" y="314" width="190" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="938" y="339">源卡</text><text class="h" x="938" y="361" fill="#2563EB">GPU1</text><rect x="1128" y="314" width="190" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="1146" y="339">目标卡</text><text class="h" x="1146" y="361" fill="#D97706">GPU2</text><rect x="920" y="392" width="220" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="938" y="417">切换时延</text><text class="h" x="938" y="439" fill="#0891B2">0.65s</text><rect x="1160" y="392" width="182" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="1178" y="417">连续恢复</text><text class="h" x="1178" y="439" fill="#059669">True</text></svg>