<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="770" viewBox="0 0 1420 770"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="770" rx="28"/><text class="title" x="42" y="58">图 20  实验 B：集群调度决策矩阵</text><text class="subtitle" x="42" y="86">同一套 ClusterSchedulerCore.plan_job 在五种资源与治理条件下输出五种不同计划，用现象说明调度器具备分流与治理判断能力。</text><rect class="card" x="42" y="126" width="1336" height="538" rx="24"/><rect x="54" y="680" width="210" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="72" y="705">直接放置</text><text class="h" x="72" y="727" fill="#059669">1 类</text><rect x="286" y="680" width="210" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="304" y="705">等待/拒绝</text><text class="h" x="304" y="727" fill="#D97706">2 类</text><rect x="518" y="680" width="210" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="536" y="705">需治理介入</text><text class="h" x="536" y="727" fill="#2563EB">2 类</text><rect x="750" y="680" width="300" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="768" y="705">目标结论</text><text class="h" x="768" y="727" fill="#0891B2">调度输出可分为 5 种状态</text><rect x="1072" y="680" width="294" height="64" rx="18" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/><text class="s" x="1090" y="705">证据口径</text><text class="h" x="1090" y="727" fill="#64748B">真实调度器 plan_job</text><text class="s" x="72" y="164">计划类型</text><text class="s" x="240" y="164">触发条件</text><text class="s" x="716" y="164">调度输出</text><text class="s" x="1002" y="164">治理含义</text><rect x="58" y="184" width="1292" height="74" rx="18" fill="#ECFDF5" stroke="#D7E1EC" stroke-width="1"/><rect x="72" y="198" width="116" height="46" rx="14" fill="#059669"/><text class="k" x="92" y="226" fill="#FFFFFF">place</text><text class="p" x="240" y="214"><tspan x="240" dy="0">队列 active，node-a/ node-b</tspan><tspan x="240" dy="18"> 都可调度，node-a 资源贴合度更高。</tspan></text><text class="p" x="716" y="214"><tspan x="716" dy="0">放置到 node-a；设备 gpu-0</tspan></text><text class="p" x="1002" y="214"><tspan x="1002" dy="0">证明调度器会先做准入与资源匹配，</tspan><tspan x="1002" dy="18">再按 best-fit 选择放置</tspan><tspan x="1002" dy="18">节点。</tspan></text><rect x="58" y="278" width="1292" height="74" rx="18" fill="#FFF4E5" stroke="#D7E1EC" stroke-width="1"/><rect x="72" y="292" width="116" height="46" rx="14" fill="#D97706"/><text class="k" x="92" y="320" fill="#FFFFFF">wait</text><text class="p" x="240" y="308"><tspan x="240" dy="0">队列仍是 active，但同队列运行作业已达到 </tspan><tspan x="240" dy="18">max_concurrency=1。</tspan></text><text class="p" x="716" y="308"><tspan x="716" dy="0">输出 queue queue-busy </tspan><tspan x="716" dy="18">reached max_concurre</tspan><tspan x="716" dy="18">ncy 1；当前不产生放置节点</tspan></text><text class="p" x="1002" y="308"><tspan x="1002" dy="0">证明系统不会盲目继续放置，而是把</tspan><tspan x="1002" dy="18">作业留在等待态，避免抢占式超发。</tspan></text><rect x="58" y="372" width="1292" height="74" rx="18" fill="#FEECEC" stroke="#D7E1EC" stroke-width="1"/><rect x="72" y="386" width="116" height="46" rx="14" fill="#DC2626"/><text class="k" x="92" y="414" fill="#FFFFFF">reject</text><text class="p" x="240" y="402"><tspan x="240" dy="0">队列被运维切为 paused，作业在准入层直接被</tspan><tspan x="240" dy="18">拒绝。</tspan></text><text class="p" x="716" y="402"><tspan x="716" dy="0">输出 queue queue-pause</tspan><tspan x="716" dy="18">d is paused；当前不产生放置节</tspan><tspan x="716" dy="18">点</tspan></text><text class="p" x="1002" y="402"><tspan x="1002" dy="0">证明治理状态能在调度入口生效，队</tspan><tspan x="1002" dy="18">列停用后不会再进入资源竞争。</tspan></text><rect x="58" y="466" width="1292" height="74" rx="18" fill="#F1F5F9" stroke="#D7E1EC" stroke-width="1"/><rect x="72" y="480" width="116" height="46" rx="14" fill="#64748B"/><text class="k" x="92" y="508" fill="#FFFFFF">hold</text><text class="p" x="240" y="496"><tspan x="240" dy="0">节点上已有占用，但现有作业不可抢占，调度器只能等</tspan><tspan x="240" dy="18">待可回收对象出现。</tspan></text><text class="p" x="716" y="496"><tspan x="716" dy="0">输出 waiting for a rec</tspan><tspan x="716" dy="18">laimable victim to a</tspan><tspan x="716" dy="18">ppear；当前不产生放置节点</tspan></text><text class="p" x="1002" y="496"><tspan x="1002" dy="0">证明系统不会把“不可治理”的占用</tspan><tspan x="1002" dy="18">伪装成可执行计划，而是明确输出 </tspan><tspan x="1002" dy="18">hold。</tspan></text><rect x="58" y="560" width="1292" height="74" rx="18" fill="#E8F1FF" stroke="#D7E1EC" stroke-width="1"/><rect x="72" y="574" width="116" height="46" rx="14" fill="#2563EB"/><text class="k" x="92" y="602" fill="#FFFFFF">preempt_then_place</text><text class="p" x="240" y="590"><tspan x="240" dy="0">目标作业优先级更高，节点被低优先级可抢占作业占用</tspan><tspan x="240" dy="18">。</tspan></text><text class="p" x="716" y="590"><tspan x="716" dy="0">输出 preempt job job-l</tspan><tspan x="716" dy="18">ow-priority before p</tspan><tspan x="716" dy="18">lacing target job；治理</tspan><tspan x="716" dy="18">动作 cancel_job, relea</tspan><tspan x="716" dy="18">se_allocation</tspan></text><text class="p" x="1002" y="590"><tspan x="1002" dy="0">证明调度器会输出“先抢占再放置”</tspan><tspan x="1002" dy="18">的治理计划，而不是只给静态告警。</tspan></text></svg>