<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="500" viewBox="0 0 1420 500"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="500" rx="28"/><text class="title" x="42" y="58">图 8  平台总体规模指标</text><text class="subtitle" x="42" y="86">用于封面和第 1 章摘要页，快速向评审展示项目的实际工程体量。</text><rect x="56" y="154" width="248" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="74" y="179">命名视图</text><text class="h" x="74" y="201" fill="#2563EB">14</text><rect x="326" y="154" width="248" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="344" y="179">后端端点</text><text class="h" x="344" y="201" fill="#059669">111</text><rect x="596" y="154" width="248" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="614" y="179">持久化表</text><text class="h" x="614" y="201" fill="#D97706">22</text><rect x="866" y="154" width="248" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="884" y="179">控制能力</text><text class="h" x="884" y="201" fill="#0891B2">29</text><rect x="1136" y="154" width="228" height="64" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text class="s" x="1154" y="179">测试资产</text><text class="h" x="1154" y="201" fill="#DC2626">280</text><rect class="card" x="56" y="274" width="1310" height="174" rx="22"/><rect x="74" y="292" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="74" y="326">规模解读</text><text class="p" x="74" y="352"><tspan x="74" dy="0">14 个命名视图说明前端已形成导入、治理、分析、智能四大叙事面。</tspan><tspan x="74" dy="22">110 个后端端点说明系统并非单页工具，而是多能力域平台。</tspan><tspan x="74" dy="22">22 张持久化表与 29 个控制能力前缀共同支撑历史回放、审计闭环与扩展控制。</tspan><tspan x="74" dy="22">260 个相关测试用例为作品书中的功能宣称提供了工程证据背景。</tspan></text></svg>