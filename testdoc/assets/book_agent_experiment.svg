<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="610" viewBox="0 0 1420 610"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="610" rx="28"/><text class="title" x="42" y="58">图 16  实验三：Agent 数据链路有效性</text><text class="subtitle" x="42" y="86">围绕采样、缓存、远程透传、训练日志过滤和失败提示设计的五维实验。</text><rect class="card" x="54" y="154" width="292" height="126" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">系统采样</text><text class="p" x="72" y="232"><tspan x="72" dy="0">非阻塞采样：True</tspan><tspan x="72" dy="22">cpu_percent 调用 4 次</tspan></text><rect class="card" x="374" y="154" width="292" height="126" rx="22"/><rect x="392" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="392" y="206">缓存效果</text><text class="p" x="392" y="232"><tspan x="392" dy="0">读取 3 次 / 真扫描 2 次</tspan><tspan x="392" dy="22">扫描减少 33.3%</tspan></text><rect class="card" x="694" y="154" width="292" height="126" rx="22"/><rect x="712" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="712" y="206">远端细节透传</text><text class="p" x="712" y="232"><tspan x="712" dy="0">返回字段 3 个</tspan><tspan x="712" dy="22">cpu_per_core, cpu_percent, network</tspan></text><rect class="card" x="1014" y="154" width="352" height="126" rx="22"/><rect x="1032" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="1032" y="206">训练日志过滤</text><text class="p" x="1032" y="232"><tspan x="1032" dy="0">输入 3 条 / 输出 2 条</tspan><tspan x="1032" dy="22">范围外日志削减 33.3%</tspan></text><rect class="card" x="54" y="322" width="620" height="136" rx="22"/><rect x="72" y="340" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="374">失败可解释性</text><text class="p" x="72" y="400"><tspan x="72" dy="0">启动提示级别：warning</tspan><tspan x="72" dy="22">缺失 NVML 时给出远程接入提示：True</tspan></text><rect class="card" x="706" y="322" width="660" height="136" rx="22"/><rect x="724" y="340" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="724" y="374">实验结论</text><text class="p" x="724" y="400"><tspan x="724" dy="0">Agent 的有效性不是单点采集，而是采样开销可控、远端字段可透传、日志可按导入范围过滤、失败可解释。</tspan><tspan x="724" dy="22">这些结论都来自实际执行过的函数链路，而不是代码静态统计。</tspan></text><rect x="54" y="494" width="448" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="519">观测口径</text><text class="h" x="72" y="541" fill="#2563EB">实际调用 system_monitor / task_monitor / monitor API / Agent 启动提示</text><rect x="526" y="494" width="360" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="544" y="519">关键现象</text><text class="h" x="544" y="541" fill="#059669">3 次读取只触发 2 次真实进程扫描</text><rect x="910" y="494" width="456" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="928" y="519">证明能力</text><text class="h" x="928" y="541" fill="#D97706">Agent 是平台可接入、可过滤、可解释的数据入口</text></svg>