<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="740" viewBox="0 0 1420 740"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="740" rx="28"/><text class="title" x="42" y="58">双 GPU 并发竞争治理时间线</text><text class="subtitle" x="42" y="86">同机双卡同时拉高负载，只对治理卡执行系统治理动作，观察两条曲线如何分离。</text><rect class="card" x="42" y="126" width="828" height="368" rx="24"/><rect class="card" x="42" y="520" width="828" height="178" rx="24"/><rect class="card" x="900" y="126" width="478" height="572" rx="24"/><rect x="74" y="180" width="84.4" height="288" fill="#E8F1FF"/><rect x="158.4" y="180" width="168.9" height="288" fill="#FFF4E5"/><rect x="327.3" y="180" width="506.7" height="288" fill="#ECFDF5"/><line x1="74" y1="236.9" x2="834" y2="236.9" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 8"/><polyline points="74.0,444.0 102.1,444.3 130.3,435.6 158.4,444.2 186.6,444.4 214.7,435.5 242.9,444.3 271.0,444.4 299.2,275.2 327.3,216.4 355.5,269.1 383.6,267.0 411.8,266.8 439.9,268.0 468.1,266.4 496.2,267.3 524.4,267.7 552.5,267.7 580.7,266.7 608.8,266.5 637.0,267.6 665.1,267.3 693.3,287.7 721.4,287.6 749.6,287.7 777.7,287.8 805.9,287.8 834.0,287.5" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="74.0,447.1 102.1,454.6 130.3,454.9 158.4,446.8 186.6,454.7 214.7,454.7 242.9,447.0 271.0,454.4 299.2,287.0 327.3,232.7 355.5,232.6 383.6,234.2 411.8,232.3 439.9,231.9 468.1,232.6 496.2,229.7 524.4,230.6 552.5,232.5 580.7,229.6 608.8,231.5 637.0,230.8 665.1,231.0 693.3,230.9 721.4,229.9 749.6,228.4 777.7,229.9 805.9,229.1 834.0,229.1" fill="none" stroke="#D97706" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="74.0,215.2 102.1,215.2 130.3,215.2 158.4,215.2 186.6,215.2 214.7,215.2 242.9,215.2 271.0,215.2 299.2,215.2 327.3,215.2 355.5,266.5 383.6,266.5 411.8,266.5 439.9,266.5 468.1,266.5 496.2,266.5 524.4,266.5 552.5,266.5 580.7,266.5 608.8,266.5 637.0,266.5 665.1,266.5 693.3,287.4 721.4,287.4 749.6,287.4 777.7,287.4 805.9,287.4 834.0,287.4" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="355.5" y1="180" x2="355.5" y2="468" stroke="#0891B2" stroke-width="3" stroke-dasharray="10 8"/><text class="h" x="74" y="166">治理卡 vs 对照卡功耗时间线</text><text class="s" x="74" y="228.9">告警阈值 320W</text><polyline points="74.0,646.9 102.1,647.9 130.3,646.6 158.4,646.8 186.6,648.9 214.7,646.3 242.9,646.9 271.0,649.0 299.2,551.8 327.3,519.0 355.5,534.2 383.6,533.5 411.8,533.3 439.9,533.6 468.1,533.0 496.2,532.6 524.4,533.2 552.5,533.2 580.7,532.2 608.8,532.8 637.0,532.9 665.1,532.6 693.3,538.9 721.4,538.2 749.6,537.7 777.7,538.3 805.9,538.0 834.0,536.9" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="355.5" y1="548" x2="355.5" y2="654" stroke="#0891B2" stroke-width="3" stroke-dasharray="10 8"/><text class="h" x="74" y="540">整机总功率变化</text><text class="s" x="920" y="176">怎么读这张图</text><text class="p" x="920" y="208">1. 蓝线是治理 GPU1 的实测功耗，橙线是对照 GPU3 的实测功耗。</text><text class="p" x="920" y="236">2. 绿线是治理卡的功耗上限，青虚线是治理动作生效时刻。</text><text class="p" x="920" y="264">3. 动作后蓝线从 348W 峰值回落到约 268W，而橙线继续维持 328W 高位。</text><text class="p" x="920" y="292">4. 下方灰线是整机总功率，治理后出现同步回落。</text><text class="p" x="920" y="334">治理卡后窗均值：268.44W</text><text class="p" x="920" y="362">对照卡后窗均值：328.26W</text><text class="p" x="920" y="390">功耗均值差：59.82W</text><text class="p" x="920" y="418">整机总功率回落：95.47W</text><text class="p" x="920" y="446">治理动作：GPU1 -> 279W</text><text class="p" x="920" y="474">预算阈值：783W</text><rect x="920" y="604" width="150" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="938" y="629">治理卡峰值</text><text class="h" x="938" y="651" fill="#2563EB">348.4W</text><rect x="1090" y="604" width="150" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="1108" y="629">对照卡峰值</text><text class="h" x="1108" y="651" fill="#D97706">325.8W</text><rect x="1260" y="604" width="108" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="1278" y="629">有效</text><text class="h" x="1278" y="651" fill="#059669">True</text></svg>