<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="670" viewBox="0 0 1420 670"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="670" rx="28"/><text class="title" x="42" y="58">图 22  实验 D：治理对象覆盖与审计证据</text><text class="subtitle" x="42" y="86">从当前集群控制台界面反推可操作对象，展示系统已经把哪些治理动作真正挂到作业、队列、节点与 allocation 上。</text><rect class="card" x="54" y="154" width="620" height="182" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">作业对象</text><text class="p" x="72" y="232"><tspan x="72" dy="0">能力 8 项：cancel, checkpoint, pause</tspan><tspan x="72" dy="22">动作续：preempt, requeue, restore</tspan><tspan x="72" dy="22">动作续：resume, submit</tspan><tspan x="72" dy="22">入口：ClusterJobLedger 提交区 + 行内动作</tspan><tspan x="72" dy="22">证据：作业台账提交与行内动作，共享 submitBuiltinCommand 与刷新回写。</tspan></text><rect class="card" x="706" y="154" width="660" height="182" rx="22"/><rect x="724" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="724" y="206">队列对象</text><text class="p" x="724" y="232"><tspan x="724" dy="0">能力 1 项：reconcile</tspan><tspan x="724" dy="22">入口：ClusterConsoleToolbar 手动调和</tspan><tspan x="724" dy="22">证据：队列对象通过 queue.reconcile 进入调和控制器，状态回写到 controller snapshot。</tspan></text><rect class="card" x="54" y="370" width="620" height="182" rx="22"/><rect x="72" y="388" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="72" y="422">节点对象</text><text class="p" x="72" y="448"><tspan x="72" dy="0">能力 2 项：drain, undrain</tspan><tspan x="72" dy="22">入口：ClusterAllocationPanel 节点排空切换</tspan><tspan x="72" dy="22">证据：节点对象通过 drain_state 在调和前改变可调度性，再刷新节点快照。</tspan></text><rect class="card" x="706" y="370" width="660" height="182" rx="22"/><rect x="724" y="388" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="724" y="422">allocation 对象</text><text class="p" x="724" y="448"><tspan x="724" dy="0">能力 1 项：release</tspan><tspan x="724" dy="22">入口：ClusterAllocationPanel allocation 释放</tspan><tspan x="724" dy="22">证据：allocation.release 先释放资源，再触发作业状态回摆，避免资源悬挂。</tspan></text><rect x="54" y="580" width="220" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="605">治理对象</text><text class="h" x="72" y="627" fill="#2563EB">4</text><rect x="296" y="580" width="220" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="314" y="605">前端暴露能力</text><text class="h" x="314" y="627" fill="#059669">12</text><rect x="538" y="580" width="350" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="556" y="605">读取口径</text><text class="h" x="556" y="627" fill="#D97706">ClusterJobs.vue + clusterConsoleActions.js</text><rect x="910" y="580" width="456" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="928" y="605">审计结论</text><text class="h" x="928" y="627" fill="#0891B2">治理动作不是抽象概念，而是已进入当前控制台的对象级命令面。</text></svg>