<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="480" viewBox="0 0 1420 480"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="480" rx="28"/><text class="title" x="42" y="58">图 13  策略写入到复盘导出联动</text><text class="subtitle" x="42" y="86">联动路径来自前后端代码，写入次数与联动时延为答辩示意值，用于说明治理闭环而非线上报表。</text><rect class="card" x="54" y="154" width="300" height="132" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">策略写入</text><text class="p" x="72" y="232"><tspan x="72" dy="0">总次数 28</tspan><tspan x="72" dy="22">budget / carbon / auto / power / run_once / user_rule</tspan></text><rect class="card" x="404" y="154" width="300" height="132" rx="22"/><rect x="422" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="422" y="206">Review 可见</text><text class="p" x="422" y="232"><tspan x="422" dy="0">28</tspan><tspan x="422" dy="22">Policies 写入后立即 refreshReview</tspan></text><rect class="card" x="754" y="154" width="300" height="132" rx="22"/><rect x="772" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="772" y="206">导出覆盖</text><text class="p" x="772" y="232"><tspan x="772" dy="0">28</tspan><tspan x="772" dy="22">full-report 聚合综合治理结果</tspan></text><rect class="card" x="1104" y="154" width="262" height="132" rx="22"/><rect x="1122" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="1122" y="206">平均联动</text><text class="p" x="1122" y="232"><tspan x="1122" dy="0">1.05 s</tspan><tspan x="1122" dy="22">用于示意多轮策略操作的闭环时延</tspan></text><line x1="354" y1="220" x2="392" y2="220" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polygon points="404,220 392,214 392,226" fill="#2563EB"/><line x1="704" y1="220" x2="742" y2="220" stroke="#059669" stroke-width="4" stroke-linecap="round"/><polygon points="754,220 742,214 742,226" fill="#059669"/><line x1="1054" y1="220" x2="1092" y2="220" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><polygon points="1104,220 1092,214 1092,226" fill="#D97706"/><rect x="54" y="340" width="430" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="365">代码依据</text><text class="h" x="72" y="387" fill="#2563EB">GovernancePoliciesView 中每次写入后都会 refreshPolicies 与 refreshReview</text><rect x="508" y="340" width="398" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="526" y="365">闭环结论</text><text class="h" x="526" y="387" fill="#059669">策略页不是孤立配置页，而是可复盘、可导出的治理入口</text><rect x="930" y="340" width="436" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="948" y="365">作品书作用</text><text class="h" x="948" y="387" fill="#D97706">用于支撑模板第 5 章“有效性与稳定性应由结果支持”这一要求</text></svg>