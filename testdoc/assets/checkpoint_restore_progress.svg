<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="680" viewBox="0 0 1420 680"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="680" rx="28"/><text class="title" x="42" y="58">实验 F：进度连续性与控制效果</text><text class="subtitle" x="42" y="86">把检查点步数、恢复起点与最终步数放在同一张标准测试图上，证明任务是接续而不是重跑。</text><rect class="card" x="42" y="126" width="1336" height="512" rx="24"/><rect x="74.0" y="176.0" width="760.0" height="250.0" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="1.2"/><line x1="74.0" y1="426.0" x2="834.0" y2="426.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="64.0" y="430.0" text-anchor="end">0</text><line x1="74.0" y1="371.7" x2="834.0" y2="371.7" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="64.0" y="375.7" text-anchor="end">10</text><line x1="74.0" y1="317.3" x2="834.0" y2="317.3" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="64.0" y="321.3" text-anchor="end">20</text><line x1="74.0" y1="263.0" x2="834.0" y2="263.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="64.0" y="267.0" text-anchor="end">30</text><line x1="74.0" y1="208.6" x2="834.0" y2="208.6" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="64.0" y="212.6" text-anchor="end">40</text><line x1="108.5" y1="176.0" x2="108.5" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="108.5" y="446.0" text-anchor="middle">暂停前</text><line x1="281.3" y1="176.0" x2="281.3" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="281.3" y="446.0" text-anchor="middle">暂停后</text><line x1="454.0" y1="176.0" x2="454.0" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="454.0" y="446.0" text-anchor="middle">检查点</text><line x1="626.7" y1="176.0" x2="626.7" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="626.7" y="446.0" text-anchor="middle">恢复起点</text><line x1="799.5" y1="176.0" x2="799.5" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="799.5" y="446.0" text-anchor="middle">恢复终点</text><text class="s" x="454.0" y="470.0" text-anchor="middle">关键事件</text><text class="s" x="22.0" y="301.0" text-anchor="middle" transform="rotate(-90 22.0 301.0)">Step</text><polyline points="108.5,360.8 281.3,349.9 454.0,268.4 626.7,241.2 799.5,197.7" fill="none" stroke="#2563EB" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="108.5" cy="360.8" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/><circle cx="281.3" cy="349.9" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/><circle cx="454.0" cy="268.4" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/><circle cx="626.7" cy="241.2" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/><circle cx="799.5" cy="197.7" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/><line x1="74.0" y1="268.4" x2="834.0" y2="268.4" stroke="#0891B2" stroke-width="2" stroke-dasharray="8 6"/><text class="s" x="80.0" y="260.4">checkpoint = 29</text><line x1="454.0" y1="176.0" x2="454.0" y2="426.0" stroke="#0891B2" stroke-width="2.5" stroke-dasharray="8 6"/><text class="s" x="460.0" y="194.0">写出检查点</text><text class="s" x="108.5" y="350.8" text-anchor="middle">12</text><text class="s" x="281.3" y="339.9" text-anchor="middle">14</text><text class="s" x="454.0" y="258.4" text-anchor="middle">29</text><text class="s" x="626.7" y="231.2" text-anchor="middle">34</text><text class="s" x="799.5" y="187.7" text-anchor="middle">42</text><text class="h" x="74" y="164">关键事件上的进度步数</text><rect x="884.0" y="176.0" width="430.0" height="250.0" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="1.2"/><line x1="884.0" y1="426.0" x2="1314.0" y2="426.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="430.0" text-anchor="end">0</text><line x1="884.0" y1="376.0" x2="1314.0" y2="376.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="380.0" text-anchor="end">2</text><line x1="884.0" y1="326.0" x2="1314.0" y2="326.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="330.0" text-anchor="end">4</text><line x1="884.0" y1="276.0" x2="1314.0" y2="276.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="280.0" text-anchor="end">6</text><line x1="884.0" y1="226.0" x2="1314.0" y2="226.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="230.0" text-anchor="end">8</text><line x1="884.0" y1="176.0" x2="1314.0" y2="176.0" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="874.0" y="180.0" text-anchor="end">10</text><line x1="1001.3" y1="176.0" x2="1001.3" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="1001.3" y="446.0" text-anchor="middle">暂停冻结增量</text><line x1="1196.7" y1="176.0" x2="1196.7" y2="426.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="1196.7" y="446.0" text-anchor="middle">恢复后新增</text><text class="s" x="1099.0" y="470.0" text-anchor="middle">增量项</text><text class="s" x="832.0" y="301.0" text-anchor="middle" transform="rotate(-90 832.0 301.0)">Delta Steps</text><rect x="934.8" y="376.0" width="119.6" height="50.0" rx="6" fill="#059669" opacity="0.92"/><text class="s" x="994.6" y="368.0" text-anchor="middle">2</text><rect x="1130.3" y="226.0" width="119.6" height="200.0" rx="6" fill="#059669" opacity="0.92"/><text class="s" x="1190.1" y="218.0" text-anchor="middle">8</text><text class="h" x="884" y="164">冻结与恢复增量</text><text class="p" x="74" y="472">左图横轴是暂停、检查点和恢复过程中的关键事件，纵轴是 progress.json 中记录的 step。</text><text class="p" x="74" y="498">如果任务从 0 重跑，恢复起点会接近 0；而真实结果直接从 34 步起跑，并最终推进到 42 步。</text><rect x="74" y="548" width="180" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="92" y="573">检查点步数</text><text class="h" x="92" y="595" fill="#0891B2">29</text><rect x="276" y="548" width="180" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="294" y="573">恢复起点</text><text class="h" x="294" y="595" fill="#2563EB">34</text><rect x="478" y="548" width="180" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="496" y="573">恢复终点</text><text class="h" x="496" y="595" fill="#059669">42</text><rect x="680" y="548" width="232" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="698" y="573">连续接续</text><text class="h" x="698" y="595" fill="#D97706">True</text><rect x="934" y="548" width="190" height="64" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text class="s" x="952" y="573">暂停冻结增量</text><text class="h" x="952" y="595" fill="#DC2626">2</text><rect x="1146" y="548" width="190" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="1164" y="573">恢复新增步数</text><text class="h" x="1164" y="595" fill="#059669">8</text></svg>