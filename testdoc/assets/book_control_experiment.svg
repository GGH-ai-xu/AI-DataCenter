<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="610" viewBox="0 0 1420 610"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="610" rx="28"/><text class="title" x="42" y="58">图 17  实验四：控制平面闭环验证</text><text class="subtitle" x="42" y="86">通过 4 类控制场景观察命令状态如何从提交进入执行、审批、拒绝与持久化。</text><rect class="card" x="54" y="154" width="270" height="124" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">直接执行</text><text class="p" x="72" y="232"><tspan x="72" dy="0">最终状态：succeeded</tspan><tspan x="72" dy="22">无需审批，提交即执行</tspan></text><rect class="card" x="354" y="154" width="270" height="124" rx="22"/><rect x="372" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="372" y="206">确认门槛</text><text class="p" x="372" y="232"><tspan x="372" dy="0">未确认风险即阻断：True</tspan><tspan x="372" dy="22">说明 confirm_required 真正生效</tspan></text><rect class="card" x="654" y="154" width="270" height="124" rx="22"/><rect x="672" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="672" y="206">确认后执行</text><text class="p" x="672" y="232"><tspan x="672" dy="0">最终状态：succeeded</tspan><tspan x="672" dy="22">确认风险后转入真实执行</tspan></text><rect class="card" x="954" y="154" width="412" height="124" rx="22"/><rect x="972" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="972" y="206">审批链路</text><text class="p" x="972" y="232"><tspan x="972" dy="0">创建时：awaiting_approval</tspan><tspan x="972" dy="22">批准后：succeeded / 拒绝后：rejected</tspan></text><rect class="card" x="54" y="320" width="620" height="136" rx="22"/><rect x="72" y="338" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="372">台账持久化</text><text class="p" x="72" y="398"><tspan x="72" dy="0">持久化命令 4 条</tspan><tspan x="72" dy="22">成功 3 条 / 拒绝 1 条</tspan></text><rect class="card" x="706" y="320" width="660" height="136" rx="22"/><rect x="724" y="338" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="724" y="372">实验结论</text><text class="p" x="724" y="398"><tspan x="724" dy="0">控制平面不是按钮直调，而是把直接执行、风险确认、人工审批和拒绝回写纳入同一条状态机。</tspan><tspan x="724" dy="22">因此平台能够给出可复盘的治理证据，而不是只给出一次动作结果。</tspan></text><rect x="54" y="494" width="432" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="519">观测口径</text><text class="h" x="72" y="541" fill="#2563EB">实际调用 ControlPlaneService 与 /api/control 路由模型</text><rect x="510" y="494" width="402" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="528" y="519">关键现象</text><text class="h" x="528" y="541" fill="#059669">同一套命令模型同时支持 direct / confirm / approval / reject</text><rect x="936" y="494" width="430" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="954" y="519">证明能力</text><text class="h" x="954" y="541" fill="#D97706">系统具备统一控制平面与可审计命令生命周期</text></svg>