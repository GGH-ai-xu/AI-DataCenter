<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="560" viewBox="0 0 1420 560"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="560" rx="28"/><text class="title" x="42" y="58">图 12  治理命令生命周期</text><text class="subtitle" x="42" y="86">状态字段与流转节点来自代码和测试，图中命令数量为答辩示意值，用于解释统一控制闭环。</text><rect class="card" x="52" y="154" width="218" height="118" rx="22"/><rect x="70" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="70" y="206">命令总量</text><text class="p" x="70" y="232"><tspan x="70" dy="0">60</tspan></text><rect class="card" x="316" y="154" width="242" height="118" rx="22"/><rect x="334" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="334" y="206">待审批</text><text class="p" x="334" y="232"><tspan x="334" dy="0">18</tspan></text><rect class="card" x="604" y="154" width="242" height="118" rx="22"/><rect x="622" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="622" y="206">直接入队</text><text class="p" x="622" y="232"><tspan x="622" dy="0">42</tspan></text><rect class="card" x="892" y="154" width="218" height="118" rx="22"/><rect x="910" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="910" y="206">执行成功</text><text class="p" x="910" y="232"><tspan x="910" dy="0">54</tspan></text><rect class="card" x="1156" y="154" width="210" height="118" rx="22"/><rect x="1174" y="172" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="1174" y="206">失败 / 拒绝</text><text class="p" x="1174" y="232"><tspan x="1174" dy="0">4 / 2</tspan></text><line x1="270" y1="214" x2="304" y2="214" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polygon points="316,214 304,208 304,220" fill="#2563EB"/><line x1="558" y1="214" x2="592" y2="214" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><polygon points="604,214 592,208 592,220" fill="#D97706"/><line x1="846" y1="214" x2="880" y2="214" stroke="#059669" stroke-width="4" stroke-linecap="round"/><polygon points="892,214 880,208 880,220" fill="#059669"/><line x1="1110" y1="214" x2="1144" y2="214" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="1156,214 1144,208 1144,220" fill="#0891B2"/><rect class="card" x="52" y="344" width="1314" height="172" rx="22"/><rect x="70" y="362" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="70" y="396">状态机解释</text><text class="p" x="70" y="422"><tspan x="70" dy="0">create_command 先创建命令记录，再按 permission_mode 分流为 not_required / confirm_required / approval_required。</tspan><tspan x="70" dy="22">approve_command 负责待审批命令的批准或拒绝；_execute_command 负责真实执行与结果回写。</tspan><tspan x="70" dy="22">GovernanceReviewView 最终消费同一批 commandRecords 并支持 full-report 导出。</tspan></text></svg>