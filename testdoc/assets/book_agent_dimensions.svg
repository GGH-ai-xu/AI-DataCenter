<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="620" viewBox="0 0 1420 620"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="620" rx="28"/><text class="title" x="42" y="58">图 17  Agent 多维有效性拆解</text><text class="subtitle" x="42" y="86">这张图不用主观评分，而是把 Agent 的有效性拆成接口、遥测、效率、适配与可解释性五个维度。</text><rect class="card" x="54" y="154" width="292" height="126" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">接口完整度</text><text class="p" x="72" y="232"><tspan x="72" dy="0">21 个接口</tspan><tspan x="72" dy="22">采集 / 控制 / 运行时 三层</tspan></text><rect class="card" x="374" y="154" width="292" height="126" rx="22"/><rect x="392" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="392" y="206">遥测丰富度</text><text class="p" x="392" y="232"><tspan x="392" dy="0">10 个核心字段</tspan><tspan x="392" dy="22">温度 / 功耗 / 显存 / 时钟</tspan></text><rect class="card" x="694" y="154" width="292" height="126" rx="22"/><rect x="712" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="712" y="206">运行效率</text><text class="p" x="712" y="232"><tspan x="712" dy="0">3 次读取 / 2 次扫描</tspan><tspan x="712" dy="22">缓存降低高频拉取阻塞</tspan></text><rect class="card" x="1014" y="154" width="352" height="126" rx="22"/><rect x="1032" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="1032" y="206">平台适配度</text><text class="p" x="1032" y="232"><tspan x="1032" dy="0">4 个已验证接入点</tspan><tspan x="1032" dy="22">Provider / import scope / training filter</tspan></text><rect class="card" x="54" y="320" width="620" height="150" rx="22"/><rect x="72" y="338" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="372">失败可解释性</text><text class="p" x="72" y="398"><tspan x="72" dy="0">缺失 NVML 时不会伪造 GPU 数据。</tspan><tspan x="72" dy="22">启动阶段会明确提示改用 SSH Linux 或远程 Agent。</tspan></text><rect class="card" x="714" y="320" width="652" height="150" rx="22"/><rect x="732" y="338" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="732" y="372">真实测试支撑</text><text class="p" x="732" y="398"><tspan x="732" dy="0">相关真实通过 21 项，覆盖采样、缓存、远程读取与启动提示。</tspan><tspan x="732" dy="22">耗时 0.73 s，整张图不使用主观评分。</tspan></text><rect x="54" y="506" width="400" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="531">图表口径</text><text class="h" x="72" y="553" fill="#2563EB">全部指标来自代码统计或已运行测试</text><rect x="478" y="506" width="404" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="496" y="531">评审价值</text><text class="h" x="496" y="553" fill="#059669">把 Agent 的“有效”拆成可核查的五个维度</text><rect x="906" y="506" width="460" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="924" y="531">核心结论</text><text class="h" x="924" y="553" fill="#D97706">Agent 不只是采样器，而是平台的接入、过滤与动作执行底座</text></svg>