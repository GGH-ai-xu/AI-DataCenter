<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="690" viewBox="0 0 1420 690"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="690" rx="28"/><text class="title" x="42" y="58">图 21  实验 C：调和执行与状态回写</text><text class="subtitle" x="42" y="86">围绕 ClusterReconcileController.run_once 构造执行与跳过两类场景，观察调和动作是否真正回写到控制器快照。</text><rect class="card" x="54" y="154" width="268" height="132" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">人工触发</text><text class="p" x="72" y="232"><tspan x="72" dy="0">trigger = manual</tspan><tspan x="72" dy="22">入口：/api/cluster/reconcile</tspan><tspan x="72" dy="22">tick 增量 1</tspan></text><rect class="card" x="368" y="154" width="268" height="132" rx="22"/><rect x="386" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="386" y="206">运行时检查</text><text class="p" x="386" y="232"><tspan x="386" dy="0">status = connected</tspan><tspan x="386" dy="22">允许进入 nodes_loader</tspan><tspan x="386" dy="22">开始形成调和摘要</tspan></text><rect class="card" x="682" y="154" width="332" height="132" rx="22"/><rect x="700" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="700" y="206">摘要回写</text><text class="p" x="700" y="232"><tspan x="700" dy="0">placed=2 / preempted=1</tspan><tspan x="700" dy="22">restored=1 / released=1</tspan><tspan x="700" dy="22">结果写入 last_summary</tspan></text><rect class="card" x="1060" y="154" width="306" height="132" rx="22"/><rect x="1078" y="172" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="1078" y="206">控制器快照</text><text class="p" x="1078" y="232"><tspan x="1078" dy="0">last_summary keys placed, preempted, released, restored, runtime_status, skipped</tspan><tspan x="1078" dy="22">供前端控制台和审计视图消费</tspan><tspan x="1078" dy="22">一次人工调和会形成可回写的状态摘要。</tspan></text><line x1="322" y1="220" x2="356" y2="220" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><polygon points="368,220 356,214 356,226" fill="#2563EB"/><line x1="636" y1="220" x2="670" y2="220" stroke="#059669" stroke-width="4" stroke-linecap="round"/><polygon points="682,220 670,214 670,226" fill="#059669"/><line x1="1014" y1="220" x2="1048" y2="220" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/><polygon points="1060,220 1048,214 1048,226" fill="#0891B2"/><rect class="card" x="42" y="340" width="1336" height="222" rx="24"/><rect x="62" y="372" width="240" height="94" rx="18" fill="#FFF4E5" stroke="#D7E1EC"/><rect x="340" y="372" width="260" height="94" rx="18" fill="#FEECEC" stroke="#D7E1EC"/><rect x="638" y="372" width="332" height="94" rx="18" fill="#F1F5F9" stroke="#D7E1EC"/><rect x="1008" y="372" width="338" height="94" rx="18" fill="#E8F1FF" stroke="#D7E1EC"/><text class="h" x="62" y="360">跳过场景</text><text class="h" x="84" y="406">后台触发</text><text class="p" x="84" y="432">trigger = background</text><text class="h" x="362" y="406">运行时未连通</text><text class="p" x="362" y="432">status = reconnecting</text><text class="h" x="660" y="406">明确返回 skipped</text><text class="p" x="660" y="432">skipped = True</text><text class="p" x="660" y="454">tick 增量 = 1</text><text class="h" x="1030" y="406">不给假成功</text><text class="p" x="1030" y="432"><tspan x="1030" dy="0">runtime status: re</tspan><tspan x="1030" dy="20">connecting</tspan></text><line x1="302" y1="419" x2="328" y2="419" stroke="#D97706" stroke-width="4" stroke-linecap="round"/><polygon points="340,419 328,413 328,425" fill="#D97706"/><line x1="600" y1="419" x2="626" y2="419" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><polygon points="638,419 626,413 626,425" fill="#DC2626"/><line x1="970" y1="419" x2="996" y2="419" stroke="#64748B" stroke-width="4" stroke-linecap="round"/><polygon points="1008,419 996,413 996,425" fill="#64748B"/><rect x="54" y="590" width="320" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="72" y="615">执行路径证明</text><text class="h" x="72" y="637" fill="#059669">manual_run 可形成 last_summary</text><rect x="396" y="590" width="320" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="414" y="615">跳过路径证明</text><text class="h" x="414" y="637" fill="#D97706">skip_run 显式返回 skipped</text><rect x="738" y="590" width="628" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="756" y="615">核心结论</text><text class="h" x="756" y="637" fill="#2563EB">调和控制器不是定时器包装，而是会根据 runtime_status 决定执行还是跳过，并把结果回写给控制台。</text></svg>