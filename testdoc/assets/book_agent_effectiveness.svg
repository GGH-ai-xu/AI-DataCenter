<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="726" viewBox="0 0 1420 726"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="726" rx="28"/><text class="title" x="42" y="58">图 15  Agent 有效性与能力覆盖</text><text class="subtitle" x="42" y="86">这张图把 Agent 的接口层、遥测层、采样策略和真实验证结果放到同一张证据图上。</text><rect class="card" x="42" y="126" width="1336" height="566" rx="24"/><rect x="90" y="234" width="88" height="220" rx="14" fill="#E7EEF7"/><rect x="90" y="300" width="88" height="154" rx="14" fill="#2563EB"/><text class="k" x="90" y="480">采集接口</text><text class="s" x="90" y="498">7</text><rect x="270" y="234" width="88" height="220" rx="14" fill="#E7EEF7"/><rect x="270" y="366" width="88" height="88" rx="14" fill="#059669"/><text class="k" x="270" y="480">控制接口</text><text class="s" x="270" y="498">4</text><rect x="450" y="234" width="88" height="220" rx="14" fill="#E7EEF7"/><rect x="450" y="234" width="88" height="220" rx="14" fill="#D97706"/><text class="k" x="450" y="480">运行时接口</text><text class="s" x="450" y="498">10</text><rect x="650" y="162" width="250" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="668" y="187">遥测字段数</text><text class="h" x="668" y="209" fill="#0891B2">10</text><rect x="920" y="162" width="250" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="938" y="187">真实通过</text><text class="h" x="938" y="209" fill="#059669">21</text><rect x="1190" y="162" width="160" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="1208" y="187">耗时</text><text class="h" x="1208" y="209" fill="#D97706">0.73 s</text><rect class="card" x="430" y="260" width="920" height="172" rx="22"/><rect x="448" y="278" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="448" y="312">有效性解释</text><text class="p" x="448" y="338"><tspan x="448" dy="0">Agent 当前共暴露 21 个接口，其中采集 7 个、控制 4 个、运行时 10 个。</tspan><tspan x="448" dy="22">GPU 采样至少覆盖 10 个核心字段，且 system_monitor 使用 interval=None/0 的非阻塞 CPU 采样方式。</tspan><tspan x="448" dy="22">进程缓存测试场景中 3 次读取仅触发 2 次真实扫描，说明 Agent 不是高频全量阻塞拉取。</tspan></text><rect x="56" y="522" width="360" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="74" y="547">为什么这张图重要</text><text class="h" x="74" y="569" fill="#2563EB">它把 Agent 从“存在一个服务”提升为“具备采集、控制、运行时三层能力”的可视化证据</text><rect x="436" y="522" width="430" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="454" y="547">评审视角</text><text class="h" x="454" y="569" fill="#059669">Agent 的有效性不应只看能否启动，而要看能否形成稳定可用的数据与动作接口</text><rect x="886" y="522" width="464" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="904" y="547">章节定位</text><text class="h" x="904" y="569" fill="#D97706">用于第 5 章回答“Agent 到底支撑了平台哪些真实能力”</text></svg>