<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="670" viewBox="0 0 1420 670"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="670" rx="28"/><text class="title" x="42" y="58">图 15  实验二：历史查询与回放的一致性</text><text class="subtitle" x="42" y="86">在同一导入范围下执行 6 类历史/回放查询，观察是否还会泄漏作用域外的数据。</text><rect class="card" x="42" y="126" width="1336" height="420" rx="24"/><text class="s" x="68" y="154">查询链路</text><text class="s" x="440" y="154">作用域内可见值</text><text class="s" x="782" y="154">越界泄漏</text><text class="s" x="1094" y="154">解释</text><rect x="58" y="176" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="201">功率摘要</text><text class="k" x="440" y="201" fill="#2563EB">2</text><text class="k" x="782" y="201" fill="#059669">0</text><text class="s" x="1094" y="201">仅返回 GPU [1, 3] 对应数据</text><rect x="58" y="230" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="255">告警列表</text><text class="k" x="440" y="255" fill="#2563EB">2</text><text class="k" x="782" y="255" fill="#059669">0</text><text class="s" x="1094" y="255">仅返回 GPU [1, 3] 对应数据</text><rect x="58" y="284" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="309">进程时间线</text><text class="k" x="440" y="309" fill="#2563EB">5</text><text class="k" x="782" y="309" fill="#059669">0</text><text class="s" x="1094" y="309">仅返回 GPU [1, 3] 对应数据</text><rect x="58" y="338" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="363">调度历史</text><text class="k" x="440" y="363" fill="#2563EB">2</text><text class="k" x="782" y="363" fill="#059669">0</text><text class="s" x="1094" y="363">仅返回 GPU [1, 3] 对应数据</text><rect x="58" y="392" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="417">优化历史</text><text class="k" x="440" y="417" fill="#2563EB">1</text><text class="k" x="782" y="417" fill="#059669">0</text><text class="s" x="1094" y="417">仅返回 GPU [1, 3] 对应数据</text><rect x="58" y="446" width="1292" height="42" rx="12" fill="#FBFDFF" stroke="#D7E1EC" stroke-width="1"/><text class="p" x="76" y="471">回放帧 GPU 数</text><text class="k" x="440" y="471" fill="#2563EB">2</text><text class="k" x="782" y="471" fill="#059669">0</text><text class="s" x="1094" y="471">仅返回 GPU [1, 3] 对应数据</text><rect x="54" y="570" width="320" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="595">覆盖查询数</text><text class="h" x="72" y="617" fill="#2563EB">6</text><rect x="396" y="570" width="320" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="414" y="595">发现泄漏</text><text class="h" x="414" y="617" fill="#059669">0</text><rect x="738" y="570" width="628" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="756" y="595">额外动作验证</text><text class="h" x="756" y="617" fill="#D97706">越界告警确认被拒绝：True（HTTP 400）</text></svg>