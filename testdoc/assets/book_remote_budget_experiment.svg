<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="630" viewBox="0 0 1420 630"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="630" rx="28"/><text class="title" x="42" y="58">图 18  实验 A：真实远端功耗告警治理闭环</text><text class="subtitle" x="42" y="86">在 10.151.225.108 的空闲 RTX 3090 上制造高功耗负载，再人工触发一次预算治理，观察功耗与告警条件的真实变化。</text><rect class="card" x="42" y="126" width="812" height="388" rx="24"/><rect x="64.0" y="170.0" width="760.0" height="324.0" fill="#FFFFFF" stroke="#D7E1EC" stroke-width="1.2"/><line x1="64.0" y1="471.7" x2="824.0" y2="471.7" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="54.0" y="475.7" text-anchor="end">0</text><line x1="64.0" y1="385.5" x2="824.0" y2="385.5" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="54.0" y="389.5" text-anchor="end">100</text><line x1="64.0" y1="299.4" x2="824.0" y2="299.4" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="54.0" y="303.4" text-anchor="end">200</text><line x1="64.0" y1="213.2" x2="824.0" y2="213.2" stroke="#E6EDF5" stroke-width="1"/><text class="s" x="54.0" y="217.2" text-anchor="end">300</text><line x1="206.5" y1="170.0" x2="206.5" y2="494.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="206.5" y="514.0" text-anchor="middle">基线</text><line x1="444.0" y1="170.0" x2="444.0" y2="494.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="444.0" y="514.0" text-anchor="middle">爬升</text><line x1="681.5" y1="170.0" x2="681.5" y2="494.0" stroke="#F1F5F9" stroke-width="1"/><text class="s" x="681.5" y="514.0" text-anchor="middle">治理后</text><text class="s" x="444.0" y="538.0" text-anchor="middle">实验阶段</text><text class="s" x="12.0" y="332.0" text-anchor="middle" transform="rotate(-90 12.0 332.0)">功耗 (W)</text><rect x="125.7" y="453.6" width="72.7" height="40.4" rx="6" fill="#2563EB" opacity="0.92"/><text class="s" x="162.1" y="445.6" text-anchor="middle">21</text><rect x="206.5" y="446.8" width="72.7" height="47.2" rx="6" fill="#D97706" opacity="0.92"/><text class="s" x="242.8" y="438.8" text-anchor="middle">29</text><rect x="363.2" y="355.2" width="72.7" height="138.8" rx="6" fill="#2563EB" opacity="0.92"/><text class="s" x="399.6" y="347.2" text-anchor="middle">135</text><rect x="444.0" y="192.3" width="72.7" height="301.7" rx="6" fill="#D97706" opacity="0.92"/><text class="s" x="480.3" y="184.3" text-anchor="middle">324</text><rect x="600.8" y="247.1" width="72.7" height="246.9" rx="6" fill="#2563EB" opacity="0.92"/><text class="s" x="637.1" y="239.1" text-anchor="middle">261</text><rect x="681.5" y="243.0" width="72.7" height="251.0" rx="6" fill="#D97706" opacity="0.92"/><text class="s" x="717.8" y="235.0" text-anchor="middle">265</text><line x1="64.0" y1="196.0" x2="824.0" y2="196.0" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 6"/><text class="s" x="70.0" y="188.0">告警阈值 320W</text><line x1="86.0" y1="148.0" x2="104.0" y2="148.0" stroke="#2563EB" stroke-width="3"/><circle cx="95.0" cy="148.0" r="3" fill="#2563EB"/><text class="s" x="112.0" y="152.0">平均功耗</text><line x1="220.0" y1="148.0" x2="238.0" y2="148.0" stroke="#D97706" stroke-width="3"/><circle cx="229.0" cy="148.0" r="3" fill="#D97706"/><text class="s" x="246.0" y="152.0">峰值功耗</text><line x1="354.0" y1="148.0" x2="372.0" y2="148.0" stroke="#DC2626" stroke-width="3"/><circle cx="363.0" cy="148.0" r="3" fill="#DC2626"/><text class="s" x="380.0" y="152.0">告警阈值</text><text class="h" x="64" y="160">功耗统计图</text><text class="s" x="64" y="182">横轴为阶段，纵轴为功耗，所有数值均来自真实采样窗口汇总。</text><rect class="card" x="884" y="154" width="482" height="118" rx="22"/><rect x="902" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="902" y="206">实测对象</text><text class="p" x="902" y="232"><tspan x="902" dy="0">主机 10.151.225.108</tspan><tspan x="902" dy="22">GPU 3，PID 1856343</tspan><tspan x="902" dy="22">原始上限 350W</tspan></text><rect class="card" x="884" y="290" width="482" height="118" rx="22"/><rect x="902" y="308" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="902" y="342">治理动作</text><text class="p" x="902" y="368"><tspan x="902" dy="0">预算阈值 492W</tspan><tspan x="902" dy="22">功耗上限 350W -&gt; 261W</tspan><tspan x="902" dy="22">动作执行成功 True</tspan></text><rect class="card" x="884" y="426" width="482" height="118" rx="22"/><rect x="902" y="444" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="902" y="478">实验结论</text><text class="p" x="902" y="504"><tspan x="902" dy="0">峰值 324.24W 后回落 63.53W</tspan><tspan x="902" dy="22">治理后 18 个样本越阈数 0</tspan><tspan x="902" dy="22">说明系统动作真实改变了设备侧功耗状态</tspan></text><rect x="54" y="548" width="280" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="72" y="573">后窗均值</text><text class="h" x="72" y="595" fill="#059669">260.71W</text><rect x="356" y="548" width="280" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="374" y="573">功耗降幅</text><text class="h" x="374" y="595" fill="#2563EB">63.53W</text><rect x="658" y="548" width="280" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="676" y="573">总功率回落</text><text class="h" x="676" y="595" fill="#D97706">65.64W</text><rect x="960" y="548" width="406" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="978" y="573">后窗清洁率</text><text class="h" x="978" y="595" fill="#0891B2">100.0%  (18 个样本)</text></svg>