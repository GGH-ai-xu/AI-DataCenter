<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="630" viewBox="0 0 1420 630"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="630" rx="28"/><text class="title" x="42" y="58">图 18  实验 A：真实远端功耗告警治理闭环</text><text class="subtitle" x="42" y="86">在 10.151.225.108 的空闲 RTX 3090 上制造高功耗负载，再人工触发一次预算治理，观察功耗与告警条件的真实变化。</text><rect class="card" x="54" y="154" width="284" height="128" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">实测对象</text><text class="p" x="72" y="232"><tspan x="72" dy="0">主机 10.151.225.108</tspan><tspan x="72" dy="22">GPU 3 / 原始上限 350W</tspan></text><rect class="card" x="366" y="154" width="284" height="128" rx="22"/><rect x="384" y="172" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="384" y="206">告警触发</text><text class="p" x="384" y="232"><tspan x="384" dy="0">峰值功耗 324.24W</tspan><tspan x="384" dy="22">阈值 320W</tspan></text><rect class="card" x="678" y="154" width="324" height="128" rx="22"/><rect x="696" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="696" y="206">治理动作</text><text class="p" x="696" y="232"><tspan x="696" dy="0">预算 492W</tspan><tspan x="696" dy="22">功耗上限 350W -&gt; 261W</tspan></text><rect class="card" x="1030" y="154" width="336" height="128" rx="22"/><rect x="1048" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="1048" y="206">治理结果</text><text class="p" x="1048" y="232"><tspan x="1048" dy="0">后窗平均功耗 260.71W</tspan><tspan x="1048" dy="22">连续 18 点越阈样本 0</tspan></text><rect class="card" x="54" y="324" width="640" height="150" rx="22"/><rect x="72" y="342" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="376">现象解释</text><text class="p" x="72" y="402"><tspan x="72" dy="0">GPU3 功耗较高: 324.24W (阈值320W)</tspan><tspan x="72" dy="22">GPU 功耗下降 63.53W（19.6%），说明调度动作不是“记录成功”，而是实际改写了 GPU 功耗上限。</tspan></text><rect class="card" x="726" y="324" width="640" height="150" rx="22"/><rect x="744" y="342" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="744" y="376">实验结论</text><text class="p" x="744" y="402"><tspan x="744" dy="0">这组实验直接证明：系统可借助 SSH provider 在真实 3090 主机上观察到功耗越阈，再通过一次人工预算调度下发 set_power_limit。</tspan><tspan x="744" dy="22">治理后 18 个连续采样点全部低于 320W 告警阈值，说明调度对功耗和告警条件都产生了可观测影响。</tspan></text><rect x="54" y="520" width="302" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="545">单次功耗降幅</text><text class="h" x="72" y="567" fill="#2563EB">63.53W</text><rect x="382" y="520" width="338" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="400" y="545">集群总功率回落</text><text class="h" x="400" y="567" fill="#059669">65.64W</text><rect x="746" y="520" width="286" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="764" y="545">治理是否成功</text><text class="h" x="764" y="567" fill="#D97706">True</text><rect x="1058" y="520" width="308" height="64" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.4"/><text class="s" x="1076" y="545">后窗清洁率</text><text class="h" x="1076" y="567" fill="#0891B2">100.0%</text></svg>