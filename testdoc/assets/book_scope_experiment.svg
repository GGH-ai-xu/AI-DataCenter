<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="610" viewBox="0 0 1420 610"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="610" rx="28"/><text class="title" x="42" y="58">图 14  实验一：作用域收缩与越界拦截</text><text class="subtitle" x="42" y="86">通过受控输入负载执行导入、实时查询、任务查询和暂停动作，观察系统边界是否真正生效。</text><rect class="card" x="54" y="154" width="280" height="126" rx="22"/><rect x="72" y="172" width="86" height="10" rx="5" fill="#2563EB"/><text class="h" x="72" y="206">受控输入</text><text class="p" x="72" y="232"><tspan x="72" dy="0">原始 GPU 4 张</tspan><tspan x="72" dy="22">原始进程 11 个</tspan></text><rect class="card" x="366" y="154" width="280" height="126" rx="22"/><rect x="384" y="172" width="86" height="10" rx="5" fill="#059669"/><text class="h" x="384" y="206">导入范围</text><text class="p" x="384" y="232"><tspan x="384" dy="0">选择 GPU [1, 3]</tspan><tspan x="384" dy="22">执行 commit_import_context</tspan></text><rect class="card" x="678" y="154" width="316" height="126" rx="22"/><rect x="696" y="172" width="86" height="10" rx="5" fill="#D97706"/><text class="h" x="696" y="206">快照收缩结果</text><text class="p" x="696" y="232"><tspan x="696" dy="0">作用域 GPU 2 张</tspan><tspan x="696" dy="22">作用域进程 5 个</tspan></text><rect class="card" x="1026" y="154" width="340" height="126" rx="22"/><rect x="1044" y="172" width="86" height="10" rx="5" fill="#0891B2"/><text class="h" x="1044" y="206">页面可见结果</text><text class="p" x="1044" y="232"><tspan x="1044" dy="0">实时页显示 GPU 2 张</tspan><tspan x="1044" dy="22">任务页显示进程 5 个</tspan></text><rect class="card" x="54" y="322" width="640" height="136" rx="22"/><rect x="72" y="340" width="86" height="10" rx="5" fill="#64748B"/><text class="h" x="72" y="374">动作验证</text><text class="p" x="72" y="400"><tspan x="72" dy="0">作用域内 PID 1004 可正常暂停。</tspan><tspan x="72" dy="22">越界 PID 被拦截：True，状态码 400。</tspan></text><rect class="card" x="726" y="322" width="640" height="136" rx="22"/><rect x="744" y="340" width="86" height="10" rx="5" fill="#DC2626"/><text class="h" x="744" y="374">实验结论</text><text class="p" x="744" y="400"><tspan x="744" dy="0">导入动作不是页面过滤，而是先改写快照，再统一影响实时读取与危险动作。</tspan><tspan x="744" dy="22">从现象上看，系统建立了真实可执行的治理边界。</tspan></text><rect x="54" y="494" width="420" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="72" y="519">观测口径</text><text class="h" x="72" y="541" fill="#2563EB">受控 workload + 实际调用导入/实时/任务/动作接口</text><rect x="498" y="494" width="390" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="516" y="519">关键现象</text><text class="h" x="516" y="541" fill="#059669">4 张卡 / 11 个进程收缩到 2 张卡 / 5 个进程</text><rect x="912" y="494" width="454" height="64" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/><text class="s" x="930" y="519">证明能力</text><text class="h" x="930" y="541" fill="#D97706">scope 同时约束快照、页面读取与危险动作执行</text></svg>