<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="740" viewBox="0 0 1420 740"><style>.bg{fill:#F4F7FB}.card{fill:#FFFFFF;stroke:#D7E1EC;stroke-width:1.4}.title{font:700 32px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.subtitle{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.h{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}.p{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.s{font:500 12px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#566579}.k{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#102033}</style><rect class="bg" x="0" y="0" width="1420" height="740" rx="28"/><text class="title" x="42" y="58">图 19  实验五时间线：功耗越阈到治理回落</text><text class="subtitle" x="42" y="86">把真实样本按时间展开，直接展示告警阈值、人工调度动作和治理后稳定区间之间的关系。</text><rect class="card" x="42" y="126" width="828" height="368" rx="24"/><rect class="card" x="42" y="520" width="828" height="178" rx="24"/><rect class="card" x="900" y="126" width="478" height="572" rx="24"/><rect x="74" y="180" width="95.0" height="288" fill="#E8F1FF"/><rect x="169.0" y="180" width="95.0" height="288" fill="#FFF4E5"/><rect x="264.0" y="180" width="570.0" height="288" fill="#ECFDF5"/><line x1="74" y1="236.9" x2="834" y2="236.9" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 8"/><polyline points="74.0,454.7 105.7,454.8 137.3,447.1 169.0,454.8 200.7,454.8 232.3,422.6 264.0,233.8 295.7,276.3 327.3,279.7 359.0,280.4 390.7,279.5 422.3,279.5 454.0,280.4 485.7,280.1 517.3,280.4 549.0,279.3 580.7,279.3 612.3,279.9 644.0,280.3 675.7,280.5 707.3,279.5 739.0,280.2 770.7,279.5 802.3,279.4 834.0,280.6" fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="74.0,215.2 105.7,215.2 137.3,215.2 169.0,215.2 200.7,215.2 232.3,215.2 264.0,215.2 295.7,279.5 327.3,279.5 359.0,279.5 390.7,279.5 422.3,279.5 454.0,279.5 485.7,279.5 517.3,279.5 549.0,279.5 580.7,279.5 612.3,279.5 644.0,279.5 675.7,279.5 707.3,279.5 739.0,279.5 770.7,279.5 802.3,279.5 834.0,279.5" fill="none" stroke="#059669" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="295.7" y1="180" x2="295.7" y2="468" stroke="#D97706" stroke-width="3" stroke-dasharray="10 8"/><text class="h" x="74" y="166">GPU3 功耗与功耗上限时间线</text><text class="s" x="74" y="228.9">告警阈值 320W</text><polyline points="74.0,643.7 105.7,651.4 137.3,648.0 169.0,645.6 200.7,650.9 232.3,633.9 264.0,518.5 295.7,545.8 327.3,550.6 359.0,550.8 390.7,542.7 422.3,550.4 454.0,550.8 485.7,547.3 517.3,550.7 549.0,550.1 580.7,542.6 612.3,550.5 644.0,550.7 675.7,543.5 707.3,550.3 739.0,550.9 770.7,544.3 802.3,550.1 834.0,551.7" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="295.7" y1="548" x2="295.7" y2="654" stroke="#D97706" stroke-width="3" stroke-dasharray="10 8"/><text class="h" x="74" y="540">集群总功率变化</text><text class="s" x="920" y="176">怎么读这张图</text><text class="p" x="920" y="208">1. 蓝线是 GPU3 实测功耗，绿线是当前功耗上限。</text><text class="p" x="920" y="236">2. 红虚线是 320W 告警阈值，蓝线穿越后触发一次真实告警。</text><text class="p" x="920" y="264">3. 橙虚线是人工调度动作生效时刻，之后绿线从 350W 切到 261W。</text><text class="p" x="920" y="292">4. 治理后蓝线稳定贴近 261W，18 个连续采样点全部低于阈值。</text><text class="p" x="920" y="334">峰值功耗：324.24W</text><text class="p" x="920" y="362">首次治理后功耗：265.42W</text><text class="p" x="920" y="390">首次治理后总功率：479.66W</text><text class="p" x="920" y="418">人工治理动作：set_power_limit GPU 3 -> 261W</text><text class="p" x="920" y="446">治理前后总功率回落：65.64W</text><text class="p" x="920" y="474">工作负载 PID：1856343</text><text class="s" x="920" y="526">阶段底色</text><text class="p" x="920" y="556">蓝色：空闲基线  橙色：负载爬升  绿色：治理后观测窗口</text><rect x="920" y="604" width="188" height="64" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/><text class="s" x="938" y="629">基线均值</text><text class="h" x="938" y="651" fill="#2563EB">20.98W</text><rect x="1130" y="604" width="108" height="64" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text class="s" x="1148" y="629">峰值</text><text class="h" x="1148" y="651" fill="#DC2626">324.24W</text><rect x="1254" y="604" width="112" height="64" rx="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/><text class="s" x="1272" y="629">后均值</text><text class="h" x="1272" y="651" fill="#059669">260.71W</text></svg>