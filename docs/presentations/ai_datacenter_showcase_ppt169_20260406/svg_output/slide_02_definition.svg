<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A"/><stop offset="100%" stop-color="#19A38C"/></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08"/><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB"/><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)"/><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)"/><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">共享算力治理而非数据看板</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A"/><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">平台把身份、导入范围与治理动作收拢为一条清晰主线。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1"/><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">2</text><rect x="124" y="168" width="1040" height="176" rx="18" fill="#17313A" fill-opacity="0.05"/><rect x="120" y="162" width="1040" height="176" rx="18" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="120" y="162" width="1040" height="6" rx="12" fill="#17313A"/><text x="640" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#17313A" text-anchor="middle"><tspan x="640" dy="0">AI DataCenter 不是一个“看 GPU 数据”的页面，</tspan><tspan x="640" dy="44">而是一套共享算力治理平台</tspan></text><text x="640" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5B6776" text-anchor="middle">平台把身份、连接、范围与治理动作组织成一个可交付的软件系统</text><rect x="124" y="392" width="320" height="212" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="120" y="386" width="320" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="120" y="386" width="320" height="6" rx="12" fill="#17313A"/><use data-icon="user" x="148" y="420" width="28" height="28" fill="#17313A"/><text x="190" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">平台先登录</text><text x="148" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="148" dy="0">用户先获得平台身份，系统再决定</tspan><tspan x="148" dy="28">谁可以看到哪些主机和主机记录。</tspan></text><rect x="484" y="392" width="320" height="212" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="480" y="386" width="320" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="480" y="386" width="320" height="6" rx="12" fill="#19A38C"/><use data-icon="target" x="508" y="420" width="28" height="28" fill="#19A38C"/><text x="550" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">导入先定范围</text><text x="508" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="508" dy="0">进入控制台前先扫描硬件、选卡导入，</tspan><tspan x="508" dy="28">后续动作都只围绕当前范围展开。</tspan></text><rect x="844" y="392" width="320" height="212" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="840" y="386" width="320" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="840" y="386" width="320" height="6" rx="12" fill="#5B8DEF"/><use data-icon="cog" x="868" y="420" width="28" height="28" fill="#5B8DEF"/><text x="910" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">控制台只做治理</text><text x="868" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="868" dy="0">控制台不再承担连接切换逻辑，</tspan><tspan x="868" dy="28">而是专注于监控、告警、任务和调度。</tspan></text></svg>