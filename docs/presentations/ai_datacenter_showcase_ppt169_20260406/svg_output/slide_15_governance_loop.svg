<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A"/><stop offset="100%" stop-color="#19A38C"/></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08"/><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB"/><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)"/><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)"/><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">监控与治理形成操作闭环</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A"/><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">从发现问题到执行动作再到观察结果，用户不必在多套工具之间来回切换。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1"/><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">15</text><rect x="88" y="172" width="324" height="426" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="84" y="166" width="324" height="426" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="84" y="166" width="324" height="6" rx="12" fill="#5B8DEF"/><rect x="482" y="172" width="324" height="426" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="478" y="166" width="324" height="426" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="478" y="166" width="324" height="6" rx="12" fill="#19A38C"/><rect x="876" y="172" width="324" height="426" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="872" y="166" width="324" height="426" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="872" y="166" width="324" height="6" rx="12" fill="#17313A"/><text x="112" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">监控侧</text><text x="506" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">决策与动作</text><text x="900" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">治理结果</text><circle cx="124" cy="242" r="5" fill="#5B8DEF"/><text x="140" y="248" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">GPU 温度 / 功耗 / 利用率</text><circle cx="124" cy="282" r="5" fill="#5B8DEF"/><text x="140" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">CPU / 内存 / 进程状态</text><circle cx="124" cy="322" r="5" fill="#5B8DEF"/><text x="140" y="328" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">告警与任务变化</text><circle cx="518" cy="242" r="5" fill="#19A38C"/><text x="534" y="248" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">设置功耗限制</text><circle cx="518" cy="282" r="5" fill="#19A38C"/><text x="534" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">暂停 / 恢复 / 终止任务