<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A"/><stop offset="100%" stop-color="#19A38C"/></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08"/><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB"/><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)"/><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)"/><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">GPU 共享正在走向常态</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A"/><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">真正的难点不在于读取状态，而在于统一角色、链路和治理范围。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1"/><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">3</text><rect x="84" y="158" width="430" height="476" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="80" y="152" width="430" height="476" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="80" y="152" width="430" height="6" rx="12" fill="#17313A"/><text x="108" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">共享算力成为常态</text><text x="108" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="108" dy="0">实验室、企业研发和共享服务器场景里，</tspan><tspan x="108" dy="30">GPU 正被越来越多的用户并行使用。</tspan></text><rect x="112" y="286" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="108" y="280" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="108" y="280" width="374" height="6" rx="12" fill="#19A38C"/><text x="130" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多角色并行</text><text x="130" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="130" dy="0">管理员、负责人、算法工程师同时关心资源状态，</tspan><tspan x="130" dy="22">但他们需要的视角和动作完全不同。</tspan></text><rect x="112" y="398" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="108" y="392" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="108" y="392" width="374" height="6" rx="12" fill="#5B8DEF"/><text x="130" y="426" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多机器来源</text><text x="130" y="454" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="130" dy="0">有的机器本地部署 agent，有的机器只有 SSH，</tspan><tspan x="130" dy="22">接入方式天然不统一。</tspan></text><rect x="112" y="510" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="108" y="504" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="108" y="504" width="374" height="6" rx="12" fill="#1F9D68"/><text x="130" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多任务交织</text><text x="130" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6776" text-anchor="start"><tspan x="130" dy="0">训练任务、告警、调度、功耗治理交错发生，</tspan><tspan x="130" dy="22">简单监控页无法承担治理职责。</tspan></text><rect x="552" y="158" width="650" height="476" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="548" y="152" width="650" height="476" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="548" y="152" width="650" height="6" rx="12" fill="#5B8DEF"/><text x="580" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">共享 GPU 场景下的三类结构性矛盾</text><rect x="586" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="582" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="582" y="232" width="186" height="6" rx="12" fill="#17313A"/><use data-icon="users" x="652" y="264" width="34" height="34" fill="#17313A"/><text x="675" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">角色视角割裂</text><text x="675" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="675" dy="0">管理员要范围</tspan><tspan x="675" dy="28">使用者要效率</tspan><tspan x="675" dy="28">负责人要复盘</tspan></text><line x1="614" y1="430" x2="736" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5"/><text x="675" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="675" dy="0">结果是同一台机器被不同工具</tspan><tspan x="675" dy="20">和不同表述方式拆开管理。</tspan></text><rect x="784" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="780" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="780" y="232" width="186" height="6" rx="12" fill="#19A38C"/><use data-icon="server" x="850" y="264" width="34" height="34" fill="#19A38C"/><text x="873" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">连接链路割裂</text><text x="873" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="873" dy="0">HTTP Agent</tspan><tspan x="873" dy="28">SSH 命令</tspan><tspan x="873" dy="28">临时脚本</tspan></text><line x1="812" y1="430" x2="934" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5"/><text x="873" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="873" dy="0">不同接入方式缺乏统一抽象，</tspan><tspan x="873" dy="20">很难形成稳定产品入口。</tspan></text><rect x="982" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05"/><rect x="978" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1"/><rect x="978" y="232" width="186" height="6" rx="12" fill="#D9485F"/><use data-icon="triangle-exclamation" x="1048" y="264" width="34" height="34" fill="#D9485F"/><text x="1071" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">治理边界割裂</text><text x="1071" y="352" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="1071" dy="0">看得到全部卡</tspan><tspan x="1071" dy="26">却不清楚该管哪张</tspan><tspan x="1071" dy="26">也不清楚动作影响谁</tspan></text><line x1="1010" y1="430" x2="1132" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5"/><text x="1071" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="1071" dy="0">资源可见不等于资源可治理，</tspan><tspan x="1071" dy="20">范围模糊会直接带来误操作。</tspan></text></svg>