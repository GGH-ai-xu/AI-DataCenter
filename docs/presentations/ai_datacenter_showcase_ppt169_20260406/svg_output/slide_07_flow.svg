<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A"/><stop offset="100%" stop-color="#19A38C"/></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08"/><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB"/><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)"/><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)"/><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">六步主流程让使用路径稳定</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A"/><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">系统把复杂接入过程拆成固定步骤，用户不再在控制台里临时切换连接。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1"/><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">7</text><circle cx="162" cy="300" r="38" fill="#17313A"/><text x="162" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="162" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">登录</text><text x="162" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="162" dy="0">确认平台身份</tspan></text><line x1="202" y1="300" x2="248" y2="300" stroke="#5B8DEF" stroke-width="4"/><polygon points="248,300 234,292 234,308" fill="#5B8DEF"/><circle cx="342" cy="300" r="38" fill="#19A38C"/><text x="342" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="342" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">准备页</text><text x="342" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="342" dy="0">进入独立导入层</tspan></text><line x1="382" y1="300" x2="428" y2="300" stroke="#5B8DEF" stroke-width="4"/><polygon points="428,300 414,292 414,308" fill="#5B8DEF"/><circle cx="522" cy="300" r="38" fill="#19A38C"/><text x="522" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="522" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">选来源</text><text x="522" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="522" dy="0">已保存主机或新建连接</tspan></text><line x1="562" y1="300" x2="608" y2="300" stroke="#5B8DEF" stroke-width="4"/><polygon points="608,300 594,292 594,308" fill="#5B8DEF"/><circle cx="702" cy="300" r="38" fill="#19A38C"/><text x="702" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="702" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">扫描</text><text x="702" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="702" dy="0">查看 CPU/GPU 状态</tspan></text><line x1="742" y1="300" x2="788" y2="300" stroke="#5B8DEF" stroke-width="4"/><polygon points="788,300 774,292 774,308" fill="#5B8DEF"/><circle cx="882" cy="300" r="38" fill="#19A38C"/><text x="882" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="882" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">选卡</text><text x="882" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="882" dy="0">确定本次治理范围</tspan></text><line x1="922" y1="300" x2="968" y2="300" stroke="#5B8DEF" stroke-width="4"/><polygon points="968,300 954,292 954,308" fill="#5B8DEF"/><circle cx="1062" cy="300" r="38" fill="#1F9D68"/><text x="1062" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="1062" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="middle">控制台</text><text x="1062" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="middle"><tspan x="1062" dy="0">开始监控与治理</tspan></text><rect x="96" y="480" width="1096" height="130" rx="12" fill="#17313A" fill-opacity="0.05"/><rect x="92" y="474" width="1096" height="130" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1"/><rect x="92" y="474" width="1096" height="6" rx="12" fill="#5B8DEF"/><text x="126" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#17313A" text-anchor="start"><tspan x="126" dy="0">最关键的变化在于：接入逻辑被迁移到控制台之前，用户必须先完成硬件扫描和范围确认。</tspan><tspan x="126" dy="32">这让后续所有治理动作都站在同一条范围边界上。</tspan></text></svg>