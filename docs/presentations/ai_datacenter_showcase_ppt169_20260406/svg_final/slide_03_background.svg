<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A" /><stop offset="100%" stop-color="#19A38C" /></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08" /><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0" /></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB" /><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)" /><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)" /><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">GPU 共享正在走向常态</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A" /><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">真正的难点不在于读取状态，而在于统一角色、链路和治理范围。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1" /><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">3</text><rect x="84" y="158" width="430" height="476" rx="12" fill="#17313A" fill-opacity="0.05" /><rect x="80" y="152" width="430" height="476" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" /><rect x="80" y="152" width="430" height="6" rx="12" fill="#17313A" /><text x="108" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">共享算力成为常态</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" x="108" y="220">实验室、企业研发和共享服务器场景里，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" x="108" y="250">GPU 正被越来越多的用户并行使用。</text><rect x="112" y="286" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="108" y="280" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="108" y="280" width="374" height="6" rx="12" fill="#19A38C" /><text x="130" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多角色并行</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="342">管理员、负责人、算法工程师同时关心资源状态，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="364">但他们需要的视角和动作完全不同。</text><rect x="112" y="398" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="108" y="392" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="108" y="392" width="374" height="6" rx="12" fill="#5B8DEF" /><text x="130" y="426" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多机器来源</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="454">有的机器本地部署 agent，有的机器只有 SSH，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="476">接入方式天然不统一。</text><rect x="112" y="510" width="374" height="98" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="108" y="504" width="374" height="98" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="108" y="504" width="374" height="6" rx="12" fill="#1F9D68" /><text x="130" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="start">多任务交织</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="566">训练任务、告警、调度、功耗治理交错发生，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" x="130" y="588">简单监控页无法承担治理职责。</text><rect x="552" y="158" width="650" height="476" rx="12" fill="#17313A" fill-opacity="0.05" /><rect x="548" y="152" width="650" height="476" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" /><rect x="548" y="152" width="650" height="6" rx="12" fill="#5B8DEF" /><text x="580" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">共享 GPU 场景下的三类结构性矛盾</text><rect x="586" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="582" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="582" y="232" width="186" height="6" rx="12" fill="#17313A" />
  <g transform="translate(652.0, 264.0) scale(2.125)" fill="#17313A">
    <path d="M8 3.5C8 4.88071 6.88071 6 5.5 6C4.11929 6 3 4.88071 3 3.5C3 2.11929 4.11929 1 5.5 1C6.88071 1 8 2.11929 8 3.5Z" />
    <path d="M3 8C1.34315 8 0 9.34315 0 11V15H8V8H3Z" />
    <path d="M13 8H10V15H16V11C16 9.34315 14.6569 8 13 8Z" />
    <path d="M12 6C13.1046 6 14 5.10457 14 4C14 2.89543 13.1046 2 12 2C10.8954 2 10 2.89543 10 4C10 5.10457 10.8954 6 12 6Z" />
  </g><text x="675" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">角色视角割裂</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="675" y="352">管理员要范围</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="675" y="380">使用者要效率</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="675" y="408">负责人要复盘</text><line x1="614" y1="430" x2="736" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5" /><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="675" y="466">结果是同一台机器被不同工具</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="675" y="486">和不同表述方式拆开管理。</text><rect x="784" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="780" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="780" y="232" width="186" height="6" rx="12" fill="#19A38C" />
  <g transform="translate(850.0, 264.0) scale(2.125)" fill="#19A38C">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M16 2H0V7H16V2ZM4 4.5C4 5.05228 3.55228 5.5 3 5.5C2.44772 5.5 2 5.05228 2 4.5C2 3.94772 2.44772 3.5 3 3.5C3.55228 3.5 4 3.94772 4 4.5Z" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M16 9H0V14H16V9ZM3 12.5C3.55228 12.5 4 12.0523 4 11.5C4 10.9477 3.55228 10.5 3 10.5C2.44772 10.5 2 10.9477 2 11.5C2 12.0523 2.44772 12.5 3 12.5Z" />
  </g><text x="873" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">连接链路割裂</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="873" y="352">HTTP Agent</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="873" y="380">SSH 命令</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="873" y="408">临时脚本</text><line x1="812" y1="430" x2="934" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5" /><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="873" y="466">不同接入方式缺乏统一抽象，</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="873" y="486">很难形成稳定产品入口。</text><rect x="982" y="238" width="186" height="316" rx="14" fill="#17313A" fill-opacity="0.05" /><rect x="978" y="232" width="186" height="316" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" /><rect x="978" y="232" width="186" height="6" rx="12" fill="#D9485F" />
  <g transform="translate(1048.0, 264.0) scale(2.125)" fill="#D9485F">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M16 15H0V12L7 0H9L16 12V15ZM7 4H9V9H7V4ZM7 11H9V13H7V11Z" />
  </g><text x="1071" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17313A" text-anchor="middle">治理边界割裂</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="1071" y="352">看得到全部卡</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="1071" y="378">却不清楚该管哪张</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="1071" y="404">也不清楚动作影响谁</text><line x1="1010" y1="430" x2="1132" y2="430" stroke="#D8E0E8" stroke-width="1" stroke-opacity="0.5" /><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="1071" y="466">资源可见不等于资源可治理，</text><text text-anchor="middle" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" x="1071" y="486">范围模糊会直接带来误操作。</text></svg>