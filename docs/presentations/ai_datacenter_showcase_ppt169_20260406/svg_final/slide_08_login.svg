      <stop offset="0%" stop-color="#17313A" />
      <stop offset="100%" stop-color="#19A38C" />
    </linearGradient>
    <radialGradient id="bgDecor" cx="80%" cy="12%" r="42%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB" />
