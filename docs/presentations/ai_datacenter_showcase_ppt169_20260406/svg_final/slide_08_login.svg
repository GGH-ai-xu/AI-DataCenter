  <rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)" />
  <text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">用户身份先于机器连接</text>
  <rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A" />
  <text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">平台登录不是装饰层，而是后续主机记录、凭据复用和权限隔离的前提。</text>
  <line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1" />
  <text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text>
  <text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text>
  <text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">8</text>
  <rect x="92" y="164" width="520" height="470" rx="16" fill="#17313A" fill-opacity="0.05" />
  <rect x="88" y="158" width="520" height="470" rx="16" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" />
  <rect x="88" y="158" width="520" height="34" rx="16" fill="#EDF2F6" />
  <circle cx="106" cy="175" r="5" fill="#D9485F" />
  <circle cx="122" cy="175" r="5" fill="#F59E0B" />
  <circle cx="138" cy="175" r="5" fill="#1F9D68" />
  <text x="166" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5B6776" text-anchor="start">Platform Login</text>
  <rect x="118" y="206" width="460" height="390" rx="14" fill="#F7F9FB" stroke="#D8E0E8" stroke-width="1" />
  <text x="160" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#17313A" text-anchor="start">AI DataCenter</text>
  <text x="160" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5B6776" text-anchor="start">平台先建立用户身份，再开放导入能力</text>
  <text x="160" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="start">用户名</text>
  <rect x="160" y="354" width="376" height="44" rx="10" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" />
  <text x="182" y="381" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">admin</text>
  <text x="160" y="426" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6776" text-anchor="start">密码</text>
  <rect x="160" y="440" width="376" height="44" rx="10" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" />
  <text x="182" y="467" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1F2937" text-anchor="start">••••••••••••</text>
  <rect x="160" y="516" width="376" height="48" rx="12" fill="#17313A" />
  <text x="348" y="547" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">登录并继续</text>
  <rect x="160" y="580" width="136" height="28" rx="14" fill="#F59E0B" />
  <text x="228.0" y="599" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">首次登录需改密</text>
  <rect x="652" y="164" width="540" height="470" rx="12" fill="#17313A" fill-opacity="0.05" />
  <rect x="648" y="158" width="540" height="470" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" />
  <rect x="648" y="158" width="540" height="6" rx="12" fill="#17313A" />
  <text x="678" y="194" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#17313A" text-anchor="start">权限与入口关系</text>
  <circle cx="690" cy="234" r="5" fill="#17313A" />
  <text x="706" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F2937" text-anchor="start">默认管理员在首次启动时自动创建</text>
  <circle cx="690" cy="270" r="5" fill="#17313A" />
  <text x="706" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F2937" text-anchor="start">默认管理员首次登录后必须修改密码</text>
  <circle cx="690" cy="306" r="5" fill="#17313A" />
  <text x="706" y="312" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F2937" text-anchor="start">管理员可查看全部用户主机记录</text>
  <circle cx="690" cy="342" r="5" fill="#17313A" />
  <text x="706" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#1F2937" text-anchor="start">普通用户只可查看自己的主机记录</text>
  <rect x="690" y="420" width="466" height="164" rx="14" fill="#17313A" fill-opacity="0.05" />
  <rect x="686" y="414" width="466" height="164" rx="14" fill="#EDF2F6" stroke="#D8E0E8" stroke-width="1" />
  <rect x="686" y="414" width="466" height="6" rx="12" fill="#5B8DEF" />
  <text x="712" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17313A" text-anchor="start">为什么必须先登录？</text>
  <text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="712" y="486">因为“已保存主机”“凭据复用”</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="712" y="510">和“管理员可见范围”都依赖</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="712" y="534">平台用户身份。没有平台登录，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" x="712" y="558">就无法建立主机归属和后续复用机制。</text></svg>