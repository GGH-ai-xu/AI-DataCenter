<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><defs><linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#17313A" /><stop offset="100%" stop-color="#19A38C" /></linearGradient><radialGradient id="bgDecor" cx="80%" cy="12%" r="42%"><stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.08" /><stop offset="100%" stop-color="#5B8DEF" stop-opacity="0" /></radialGradient></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F9FB" /><rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bgDecor)" /><rect x="0" y="0" width="1280" height="6" rx="0" fill="url(#titleGradient)" /><text x="56" y="45" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17313A" text-anchor="start">共享算力治理而非数据看板</text><rect x="56" y="64" width="1168" height="44" rx="10" fill="#17313A" /><text x="78" y="92" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">平台把身份、导入范围与治理动作收拢为一条清晰主线。</text><line x1="0" y1="694" x2="1280" y2="694" stroke="#D8E0E8" stroke-width="1" /><text x="40" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="start">Source: AI DataCenter repository and implemented product features</text><text x="640" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="middle">STRICTLY CONFIDENTIAL  |  AI DATACENTER SHOWCASE</text><text x="1240" y="711" font-family="Microsoft YaHei, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8A94A3" text-anchor="end">2</text><rect x="124" y="168" width="1040" height="176" rx="18" fill="#17313A" fill-opacity="0.05" /><rect x="120" y="162" width="1040" height="176" rx="18" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" /><rect x="120" y="162" width="1040" height="6" rx="12" fill="#17313A" /><text text-anchor="middle" fill="#17313A" font-weight="bold" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" x="640" y="225">AI DataCenter 不是一个“看 GPU 数据”的页面，</text><text text-anchor="middle" fill="#17313A" font-weight="bold" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" x="640" y="269">而是一套共享算力治理平台</text><text x="640" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5B6776" text-anchor="middle">平台把身份、连接、范围与治理动作组织成一个可交付的软件系统</text><rect x="124" y="392" width="320" height="212" rx="12" fill="#17313A" fill-opacity="0.05" /><rect x="120" y="386" width="320" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" /><rect x="120" y="386" width="320" height="6" rx="12" fill="#17313A" />
