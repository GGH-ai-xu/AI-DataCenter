  </g><text x="550" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">导入先定范围</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="508" y="474">进入控制台前先扫描硬件、选卡导入，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="508" y="502">后续动作都只围绕当前范围展开。</text><rect x="844" y="392" width="320" height="212" rx="12" fill="#17313A" fill-opacity="0.05" /><rect x="840" y="386" width="320" height="212" rx="12" fill="#FFFFFF" stroke="#D8E0E8" stroke-width="1" /><rect x="840" y="386" width="320" height="6" rx="12" fill="#5B8DEF" />
