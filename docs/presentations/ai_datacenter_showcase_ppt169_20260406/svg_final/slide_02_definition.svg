  </g><text x="910" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17313A" text-anchor="start">控制台只做治理</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="868" y="474">控制台不再承担连接切换逻辑，</text><text text-anchor="start" fill="#5B6776" font-weight="normal" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" x="868" y="502">而是专注于监控、告警、任务和调度。</text></svg>